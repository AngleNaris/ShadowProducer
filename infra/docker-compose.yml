services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: shadowproducer-postgres
    environment:
      POSTGRES_DB: shadowproducer
      POSTGRES_USER: shadowproducer
      POSTGRES_PASSWORD: shadowproducer-dev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowproducer -d shadowproducer"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - shadowproducer-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: shadowproducer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shadowproducer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shadowproducer-dev-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_BROWSER_ORIGINS:-http://127.0.0.1:3211,http://localhost:3211}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - shadowproducer-minio-data:/data

volumes:
  shadowproducer-postgres-data:
  shadowproducer-minio-data:
