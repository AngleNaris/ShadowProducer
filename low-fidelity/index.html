    const CALENDAR_TODAY = "2026-08-18";
    const CALENDAR_BASE_DATE = new Date(2026, 7, 10);
    const CALENDAR_WEEKDAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function dateFromKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function addDays(date, amount) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount);
    }

    function buildMonthCells(year, month) {
      const firstDay = new Date(year, month, 1);
      const mondayOffset = (firstDay.getDay() + 6) % 7;
      const gridStart = addDays(firstDay, -mondayOffset);
      return Array.from({ length: 42 }, (_, index) => {
        const date = addDays(gridStart, index);
        return {
          date,
          key: formatDateKey(date),
          day: date.getDate(),
          outside: date.getMonth() !== month
        };
      });
    }

    function calendarEventsForCurrentTeam() {
      const timelineEvents = weeklyTimeline.lanes.flatMap((lane) =>
        lane.tasks
          .filter((task) => !task.teamId || task.teamId === state.teamId)
          .map((task) => ({
            ...task,
            id: task.id || `timeline-${lane.id}-${task.start}-${task.row}-${task.view}`,
            laneId: lane.id,
            laneLabel: lane.label,
            color: lane.color,
            dates: Array.from({ length: task.span }, (_, index) =>
              formatDateKey(addDays(CALENDAR_BASE_DATE, task.start - 1 + index))
            )
          }))
      );
      const customEvents = calendarCustomEvents.filter((event) => event.teamId === state.teamId);
      return [...timelineEvents, ...customEvents];
    }

    function formatCalendarAgendaDate(key) {
      const date = dateFromKey(key);
      const weekday = CALENDAR_WEEKDAYS[(date.getDay() + 6) % 7];
      return `${date.getMonth() + 1} 月 ${date.getDate()} 日 · ${weekday}`;
    }

    function renderCalendarDay(cell, events) {
      const dayEvents = events.filter((event) => event.dates.includes(cell.key));
      const visibleEvents = dayEvents.slice(0, 2);
      return `
        <div
          class="calendar-day ${cell.outside ? "outside" : ""} ${cell.key === CALENDAR_TODAY ? "today" : ""} ${cell.key === state.calendarSelectedDate ? "selected" : ""}"
          data-calendar-date="${cell.key}"
          role="gridcell"
          tabindex="0"
          aria-label="${formatCalendarAgendaDate(cell.key)}，${dayEvents.length} 项日程"
          aria-selected="${cell.key === state.calendarSelectedDate}"
        >
          <span class="calendar-date-number">${cell.day}</span>
          ${visibleEvents.map((event) => `
            <button
              class="calendar-event-chip"
              type="button"
              style="--event-color:${event.color}"
              data-calendar-event="${event.id}"
              data-calendar-event-date="${cell.key}"
              title="${escapeHtml(event.title)}"
            >${escapeHtml(event.title)}</button>
          `).join("")}
          ${dayEvents.length > 2 ? `<span class="calendar-more">另有 ${dayEvents.length - 2} 项</span>` : ""}
        </div>
      `;
    }

    function selectCalendarDate(dateKey) {
      const selected = dateFromKey(dateKey);
      const monthChanged = selected.getFullYear() !== state.calendarYear || selected.getMonth() !== state.calendarMonth;
      state.calendarSelectedDate = dateKey;
      state.calendarYear = selected.getFullYear();
      state.calendarMonth = selected.getMonth();
      if (monthChanged) {
        render();
        return;
      }
      workspace.querySelectorAll(".calendar-day").forEach((day) => {
        const active = day.dataset.calendarDate === dateKey;
        day.classList.toggle("selected", active);
        day.setAttribute("aria-selected", String(active));
      });
    }

    function calendarEventById(eventId) {
      return calendarEventsForCurrentTeam().find((event) => event.id === eventId) || null;
    }

    function openCalendarEvent(eventId, dateKey) {
      const calendarEvent = calendarEventById(eventId);
      if (!calendarEvent) return;
      const project = calendarEvent.projectId ? projectById(calendarEvent.projectId) : null;
      const eventDate = dateKey || calendarEvent.dates[0];
      const relatedAction = calendarEvent.view && calendarEvent.view !== "calendar"
        ? `<button class="button" type="button" data-calendar-open-related="${calendarEvent.id}">打开关联内容</button>`
        : "";
      openModal(
        calendarEvent.title,
        `
          <div class="risk-summary">
            <div>日期</div><div>${formatCalendarAgendaDate(eventDate)}</div>
            <div>类型</div><div>${escapeHtml(calendarEvent.laneLabel)}</div>
            <div>项目</div><div>${project ? escapeHtml(project.name) : "个人日程"}</div>
            <div>说明</div><div>${escapeHtml(calendarEvent.note || calendarEvent.meta || "暂无补充说明")}</div>
          </div>
        `,
        `<button class="ghost-button" type="button" data-modal-close>关闭</button>${relatedAction}`
      );
    }

    function openCalendarDay(dateKey) {
      const dayEvents = calendarEventsForCurrentTeam().filter((event) => event.dates.includes(dateKey));
      const eventList = dayEvents.length
        ? `
          <div class="calendar-detail-list">
            ${dayEvents.map((event) => `
              <button
                class="calendar-detail-item"
                type="button"
                style="--event-color:${event.color}"
                data-calendar-list-event="${event.id}"
                data-calendar-event-date="${dateKey}"
              >
                <strong>${escapeHtml(event.title)}</strong>
                <span>${escapeHtml(event.laneLabel)} · ${escapeHtml(event.meta || "无补充信息")}</span>
              </button>
            `).join("")}
          </div>
        `
        : `<div class="calendar-detail-empty">这一天还没有日程。</div>`;
      openModal(
        formatCalendarAgendaDate(dateKey),
        eventList,
        `
          <button class="ghost-button" type="button" data-modal-close>关闭</button>
          <button class="button" type="button" data-calendar-new-from-day="${dateKey}">新建日程</button>
        `
      );
    }

    function openCalendarCreateDialog(dateKey) {
      const team = currentTeam();
      const projectOptions = team.projects.map((project) =>
        `<option value="${project.id}">${escapeHtml(project.name)}</option>`
      ).join("");
      state.calendarContextDate = dateKey;
      openModal(
        "新建日程",
        `
          <form id="calendarEventForm" data-calendar-create-form>
            <div class="field">
              <label for="calendarEventTitle">日程标题</label>
              <input id="calendarEventTitle" name="title" type="text" maxlength="60" autocomplete="off" required>
            </div>
            <div class="field">
              <label for="calendarEventDate">日期</label>
              <input id="calendarEventDate" name="date" type="date" value="${dateKey}" required>
            </div>
            <div class="field">
              <label for="calendarEventProject">归属</label>
              <select id="calendarEventProject" name="projectId">
                <option value="">个人日程</option>
                ${projectOptions}
              </select>
            </div>
            <div class="field">
              <label for="calendarEventNote">说明</label>
              <textarea id="calendarEventNote" name="note" maxlength="200" placeholder="补充时间、地点或协作信息"></textarea>
            </div>
          </form>
        `,
        `
          <button class="ghost-button" type="button" data-modal-close>取消</button>
          <button class="button" type="submit" form="calendarEventForm">创建日程</button>
        `
      );
      requestAnimationFrame(() => document.getElementById("calendarEventTitle")?.focus());
    }

    function createCalendarEvent(form) {
      const formData = new FormData(form);
      const title = String(formData.get("title") || "").trim();
      const dateKey = String(formData.get("date") || "");
      const projectId = String(formData.get("projectId") || "") || null;
      const note = String(formData.get("note") || "").trim();
      if (!title || !dateKey) return;
      const team = currentTeam();
      const project = projectId ? team.projects.find((item) => item.id === projectId) : null;
      const resolvedProjectId = project?.id || null;
      calendarCustomEvents.push({
        id: `custom-${Date.now()}`,
        title,
        meta: project ? `${team.name} · ${project.name}` : `${team.name} · 仅自己`,
        note,
        dates: [dateKey],
        laneId: project ? "project" : "personal",
        laneLabel: project ? "项目日程" : "个人日程",
        color: project ? "#2563eb" : "#64748b",
        view: project ? "project" : "calendar",
        teamId: team.id,
        projectId: resolvedProjectId
      });
      const eventDate = dateFromKey(dateKey);
      state.calendarSelectedDate = dateKey;
      state.calendarYear = eventDate.getFullYear();
      state.calendarMonth = eventDate.getMonth();
      state.calendarContextDate = null;
      closeModal();
      render();
      showToast(`已创建日程：${title}`);
    }

    function closeCalendarContextMenu() {
      calendarContextMenu.classList.remove("open");
      calendarContextMenu.setAttribute("aria-hidden", "true");
      state.calendarContextDate = null;
    }

    function openCalendarContextMenu(dateKey, clientX, clientY) {
      state.calendarContextDate = dateKey;
      calendarContextDateLabel.textContent = formatCalendarAgendaDate(dateKey);
      calendarContextMenu.classList.add("open");
      calendarContextMenu.setAttribute("aria-hidden", "false");
      const menuRect = calendarContextMenu.getBoundingClientRect();
      const left = Math.min(Math.max(8, clientX), window.innerWidth - menuRect.width - 8);
      const top = Math.min(Math.max(8, clientY), window.innerHeight - menuRect.height - 8);
      calendarContextMenu.style.left = `${left}px`;
      calendarContextMenu.style.top = `${top}px`;
      calendarContextMenu.querySelector("button")?.focus();
    }

    function renderCalendar() {
      const cells = buildMonthCells(state.calendarYear, state.calendarMonth);
      const events = calendarEventsForCurrentTeam();
      return `
        <header class="page-header">
          <div class="page-heading">
            <h1>我的日历</h1>
          </div>
        </header>
        <section class="workspace-panel" aria-label="月历">
          <div class="workspace-panel-head">
            <div><h2>${state.calendarYear} 年 ${state.calendarMonth + 1} 月</h2><p>只显示当前团队中与我相关的安排</p></div>
            <div class="calendar-panel-controls" aria-label="月份切换">
              <button class="calendar-nav-button previous" type="button" data-calendar-shift="-1" title="上个月" aria-label="上个月">${icon("arrow-right")}</button>
              <button class="calendar-today-button" type="button" data-calendar-today>今天</button>
              <button class="calendar-nav-button" type="button" data-calendar-shift="1" title="下个月" aria-label="下个月">${icon("arrow-right")}</button>
            </div>
          </div>
          <div class="calendar-main">
            <div class="month-calendar-scroll">
              <div class="month-calendar" role="grid" aria-label="${state.calendarYear} 年 ${state.calendarMonth + 1} 月日历">
                <div class="calendar-weekdays" role="row">
                  ${CALENDAR_WEEKDAYS.map((weekday) => `<div class="calendar-weekday" role="columnheader">${weekday}</div>`).join("")}
                </div>
                <div class="calendar-grid">
                  ${cells.map((cell) => renderCalendarDay(cell, events)).join("")}

              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderTeam() {
      const team = currentTeam();
      const projectCards = team.projects.map((project) => `
          <button class="project-browser-card" type="button" data-nav="project" data-target-team="${team.id}" data-target-project="${project.id}" aria-label="打开项目 ${project.name}">
            <span class="project-card-thumbnail">
              <img src="${project.thumbnail}" alt="" loading="lazy" decoding="async">
            </span>
            <span class="project-card-label">
              <strong>${project.name}</strong>
              ${icon("arrow-right")}
            </span>
          </button>
      `).join("");

      const activityRows = activities.map((activity) => {
        const project = activity.projectId

          : null;
        const projectAttribute = activity.projectId ? ` data-target-project="${activity.projectId}"` : "";
        return `
          <button class="team-activity-row" type="button" data-nav="${activity.view}" data-target-team="${team.id}"${projectAttribute} ${activity.resourceTab ? `data-resource-tab-target="${activity.resourceTab}"` : ""}>

            <span class="team-activity-copy">

              <span class="team-activity-source"><span>来源</span><strong>${project ? project.name : team.name} / ${activity.module}</strong></span>

            </span>
            ${icon("arrow-right")}

      }).join("");
      const members = teamMembers.filter((member) => member.teamId === team.id);
      const memberRows = members.map((member) => `
        <div class="team-member-row">
          <span class="team-member-avatar">${member.initials}</span>
          <div class="team-member-copy">
            <div class="team-member-name"><strong>${member.name}</strong><span>${member.role}</span></div>
            <div class="team-member-scope">${member.scope}</div>
          </div>
          ${statusChip(member.presence, member.tone)}

      return `
        ${pageHeader("团队空间", team.name, `当前角色：${team.role}`, "")}
        <div class="team-overview">
          <section class="team-feature" aria-label="项目概览">
            <div class="team-feature-head">
              <h2>项目概览</h2>
              <span class="team-feature-count">${team.projects.length} 个项目</span>
            </div>
            <div class="team-project-grid">${projectCards}</div>
          </section>
          <div class="team-detail-grid">
            <section class="team-feature-panel" aria-label="团队全部动态">
              <div class="team-feature-head">
                <h2>全部动态</h2>
                <span class="team-feature-count">${activities.length} 条</span>
              </div>
              <div class="team-activity-list">${activityRows}</div>
            </section>
            <section class="team-feature-panel" aria-label="团队成员">
              <div class="team-feature-head">
                <h2>团队成员</h2>
                <span class="team-feature-count">${members.length} 人</span>
              </div>
              <div class="team-member-list">${memberRows}</div>
            </section>
          </div>
        </div>
      `;
    }

    function renderProject() {
      const team = currentTeam();
      const project = currentProject();
      const profile = projectProgressProfiles[project.id];
      const stageSteps = profile.stages.map((stage) => `
        <div class="project-stage-step ${stage.state}">
          <span class="project-stage-marker" aria-hidden="true"></span>
          <strong>${stage.label}</strong>
          <small>${stage.note}</small>

      `).join("");
      const milestoneRows = profile.milestones.map((milestone) => `
        <button
          class="project-milestone-row"
          type="button"
          data-nav="${milestone.view}"
          data-target-team="${team.id}"
          data-target-project="${project.id}"
          ${milestone.resourceTab ? `data-resource-tab-target="${milestone.resourceTab}"` : ""}
        >
          <span class="project-milestone-marker ${milestone.tone}" aria-hidden="true"></span>
          <span class="project-milestone-copy">
            <strong>${milestone.title}</strong>
            <span>${milestone.detail}</span>

          <span class="project-milestone-date">${milestone.date}</span>
          <span class="project-milestone-state">${milestone.state}</span>

          <span class="team-activity-icon">${icon(activity.icon)}</span>
          <span class="team-activity-copy">
            <span class="team-activity-title">${activity.title}</span>
            <span class="team-activity-source"><span>来源</span><strong>${project.name} / ${activity.module}</strong></span>
            <span class="team-activity-meta"><span>操作者 ${activity.actor}</span><span>时间 ${activity.time}</span></span>

          ${icon("arrow-right")}

        ${pageHeader("项目中心", project.name, `${team.name} · 我的角色 ${project.role}`, "")}
        <div class="project-tracking-shell">

                <strong>当前阶段 · ${profile.currentStage}</strong>

    function personalContacts() {
      return contacts.filter((contact) => contact.source === "personal");
    }

    function shareAllowsField(share, field) {
      return String(share?.fields || "").split("、").includes(field);
    }

    function projectPersonalContactToTeam(contact, share, teamId) {
      return {
        ...contact,
        source: "shared",
        teamId,
        fields: share.fields,
        phone: shareAllowsField(share, "电话") ? contact.phone : "字段未共享",
        email: shareAllowsField(share, "邮箱") ? contact.email : "字段未共享",
        note: shareAllowsField(share, "备注") ? contact.note : "字段未共享",
        resourceSourceLabel: "由我共享",
        originalContactId: contact.id
      };
    }

    function teamResourceContacts(teamId = state.teamId) {
      const teamOwnedAndShared = contacts.filter((contact) =>
        (contact.source === "team" || contact.source === "shared") &&
        contact.teamId === teamId
      );
      const sharedByMe = personalContacts().flatMap((contact) => {
        const share = contact.shares?.find((item) => item.teamId === teamId);
        return share ? [projectPersonalContactToTeam(contact, share, teamId)] : [];
      });
      return [...teamOwnedAndShared, ...sharedByMe];
    }

    function teamResourceAssets(teamId = state.teamId) {
      return resourceAssets.filter((asset) => asset.teamId === teamId);
    }

    function contactMatchesProjectFilter(contact) {
      if (state.contactProjectFilter === "all") return true;
      return contact.projectIds.includes(state.contactProjectFilter);
    }

    function contactProjectNames(contact) {
      return contact.projectIds.map((id) => projectById(id)?.name || id).join("、") || "未关联";
    }

    function personalContactShareSummary(contact) {
      if (!contact.shares?.length) return "未共享";
      return contact.shares.map((share) => teams.find((team) => team.id === share.teamId)?.name || share.teamId).join("、");
    }

    function renderContactTable(rows, mode) {
      if (rows.length === 0) {
        return `<div class="contact-empty">${mode === "personal" ? "还没有个人联系人。" : "当前团队资源库暂无符合筛选的联系人。"}</div>`;
      }
      const personalMode = mode === "personal";
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:130px">姓名</th>
                <th style="width:145px">类型</th>
                ${personalMode ? `<th style="width:150px">已共享团队</th>` : `<th style="width:120px">来源</th><th style="width:110px">所有者</th>`}
                <th>联系方式</th>
                <th style="width:150px">项目</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((contact) => {
                const sourceLabel = contact.resourceSourceLabel || (contact.source === "team" ? "团队联系人" : "成员共享");
                const phone = contact.phone === "字段未共享"
                  ? `<span class="muted">字段未共享</span>`
                  : escapeHtml(contact.phone || "未填写");
                const email = contact.email === "字段未共享"
                  ? `<span class="muted">字段未共享</span>`
                  : escapeHtml(contact.email || "未填写");
                const contactMethod = `${phone} · ${email}`;
                return `
                  <tr class="contact-row ${state.selectedContact === contact.id ? "active" : ""}" data-contact-select="${contact.id}">
                    <td><strong>${escapeHtml(contact.name)}</strong></td>
                    <td>${escapeHtml(contact.type)}</td>
                    ${personalMode ? `<td>${escapeHtml(personalContactShareSummary(contact))}</td>` : `<td>${escapeHtml(sourceLabel)}</td><td>${escapeHtml(contact.owner)}</td>`}
                    <td>${contactMethod}</td>
                    <td>${escapeHtml(contactProjectNames(contact))}</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderContactDetail(contact, mode) {
      if (!contact) return `<div class="contact-empty">选择左侧联系人查看详情。</div>`;
      const personalMode = mode === "personal";
      const sourceKey = personalMode ? "personal" : (contact.source === "team" ? "team" : "shared");
      const source = contactSources[sourceKey];
      const currentShare = personalMode
        ? contact.shares?.find((share) => share.teamId === state.teamId)
        : null;
      const sourceLabel = contact.resourceSourceLabel || source.label;
      const noteMarkup = contact.note === "字段未共享"
        ? `<span class="masked">字段未共享</span>`
        : `<span class="muted">${escapeHtml(contact.note || "未填写")}</span>`;
      return `
        <div class="contact-detail">
          <h2>${escapeHtml(contact.name)}</h2>
          <div class="muted">${escapeHtml(contact.type)}</div>
          <div class="contact-detail-rule" style="--source-color:${source.color}">${source.rule}</div>
          ${personalMode
            ? `<div class="field"><label>共享到当前团队</label><div>${currentShare ? `${escapeHtml(currentTeam().name)} · ${escapeHtml(currentShare.fields)}` : "未共享"}</div></div>`
            : `<div class="field"><label>资源来源</label><div>${escapeHtml(sourceLabel)} · ${escapeHtml(contact.owner)}</div></div>`}
          <div class="field"><label>电话</label><div>${contact.phone === "字段未共享" ? `<span class="masked">字段未共享</span>` : escapeHtml(contact.phone || "—")}</div></div>
          <div class="field"><label>邮箱</label><div>${contact.email === "字段未共享" ? `<span class="masked">字段未共享</span>` : escapeHtml(contact.email || "—")}</div></div>
          <div class="field"><label>可见字段</label><div>${escapeHtml(contact.fields)}</div></div>
          <div class="field"><label>关联项目</label><div>${escapeHtml(contactProjectNames(contact))}</div></div>
          <div class="field"><label>备注</label><div>${noteMarkup}</div></div>
          <div class="contact-detail-actions">
            ${personalMode ? `<button class="button" type="button" data-contact-share="${contact.id}">${currentShare ? "调整团队共享" : "共享给团队"}</button>` : ""}
            ${personalMode || contact.source === "team" ? `<button class="ghost-button" type="button" data-contact-edit="${contact.id}" data-contact-scope="${personalMode ? "personal" : "team"}">编辑</button>` : statusChip("只读授权", "info")}
          </div>
        </div>
      `;
    }

    function renderPersonalContacts() {
      const rows = personalContacts();
      if (!rows.some((contact) => contact.id === state.selectedContact)) {
        state.selectedContact = rows[0]?.id || null;
      }
      const selected = rows.find((contact) => contact.id === state.selectedContact) || null;
      const actions = `<button class="button" type="button" data-contact-create="personal">${icon("plus")}<span>新建联系人</span></button>`;
      return `
        ${pageHeader("个人空间", "个人联系人", "", actions)}
        <div class="contact-layout">
          <div>
            <div class="contact-toolbar">
              <div class="contact-result-count">个人所有，仅在这里管理</div>
              <div class="contact-result-count">共 ${rows.length} 条</div>
            </div>
            ${renderContactTable(rows, "personal")}
          </div>
          ${renderContactDetail(selected, "personal")}
        </div>
      `;
    }

    function renderTeamResourceContacts() {
      const team = currentTeam();
      const filtered = teamResourceContacts().filter(contactMatchesProjectFilter);
      if (!filtered.some((contact) => contact.id === state.selectedContact)) {
        state.selectedContact = filtered[0]?.id || null;
      }
      const selected = filtered.find((contact) => contact.id === state.selectedContact) || null;
      const projectFilterOptions = ["all", ...team.projects.map((project) => project.id)]
        .map((id) => `<option value="${id}" ${state.contactProjectFilter === id ? "selected" : ""}>${id === "all" ? "全部项目" : (projectById(id)?.name || id)}</option>`)
        .join("");
      return `
        <div class="contact-layout">
          <div>
            <div class="contact-toolbar">
              <div class="contact-filter">
                <label for="contactProjectFilter">项目关联</label>
                <select id="contactProjectFilter" data-contact-project-filter>${projectFilterOptions}</select>
              </div>
              <div class="contact-result-count">团队联系人与成员已共享联系人 · 共 ${filtered.length} 条</div>
            </div>
            ${renderContactTable(filtered, "team")}
          </div>
          ${renderContactDetail(selected, "team")}
        </div>
      `;
    }

    function renderResourceAssets() {
      const items = teamResourceAssets();
      if (items.length === 0) return `<div class="contact-empty">当前团队资源库还没有素材。</div>`;
      const cards = items.map((item) => `
        <div class="asset">
          <div class="asset-thumb">${icon("assets")}</div>
          <div class="asset-body">
            <div class="row-title">${item.title}</div>
            <div class="row-meta">${item.meta}</div>
            <div class="progress"><span style="width:${item.pct}%"></span></div>
          </div>
        </div>
      `).join("");
      return `<div class="asset-grid">${cards}</div>`;
    }

    function renderResources() {
      const tabs = [
        { id: "contacts", label: "联系人", count: teamResourceContacts().length },
        { id: "assets", label: "素材", count: teamResourceAssets().length }
      ].map((tab) => `
        <button class="tab ${state.resourceTab === tab.id ? "active" : ""}" type="button" data-resource-tab="${tab.id}">${tab.label} <span class="muted">${tab.count}</span></button>
      `).join("");
      const actions = `
        <button class="button" type="button" data-contact-create="team">${icon("plus")}<span>新建团队联系人</span></button>
        <button class="ghost-button" type="button" data-toast="演示环境：上传队列为 Mock 状态">${icon("plus")}<span>上传素材</span></button>
      `;
      return `
        ${pageHeader("团队空间", "资源库", "", actions)}
        <div class="tabs">${tabs}</div>
        ${state.resourceTab === "assets" ? renderResourceAssets() : renderTeamResourceContacts()}
      `;
    }

    function renderPortfolio() {

    function shotThumbnail(shot) {
      return `
        <div class="shot-thumbnail ${shot.thumbnail}" style="--subject-x:${shot.subjectX}">
          <span class="shot-thumbnail-code">${shot.id}</span>
        </div>
      `;
    }

    function storyboardShotSeconds(shot) {
      const override = Number(state.storyboardDurationOverrides[shot.id]);
      return Number.isFinite(override) && override > 0 ? override : shot.seconds;
    }

    function storyboardSequence() {
      let start = 0;
      return storyboardShots.map((shot) => {
        const seconds = storyboardShotSeconds(shot);
        const item = { ...shot, seconds, start, end: start + seconds };
        start += seconds;
        return item;
      });
    }

    function formatAnimaticTime(seconds) {
      const safe = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safe / 60);
      const remainder = safe - minutes * 60;
      return `${String(minutes).padStart(2, "0")}:${remainder.toFixed(1).padStart(4, "0")}`;
    }

    function storyboardShotAtTime(time) {
      const sequence = storyboardSequence();
      const total = sequence.at(-1)?.end || 0;
      const safeTime = Math.min(Math.max(0, Number(time) || 0), Math.max(0, total - 0.001));
      return sequence.find((shot) => safeTime >= shot.start && safeTime < shot.end) || sequence.at(-1);
    }

    function renderStoryboardInspector(shot, timingEditable = false) {
      const seconds = storyboardShotSeconds(shot);
      return `
        <aside class="storyboard-inspector" aria-label="${shot.id} 镜头详情" data-storyboard-inspector data-storyboard-shot-id="${shot.id}">
          <div class="shot-detail-preview">${shotThumbnail(shot)}</div>
          <div class="detail-stack">
            <div class="field"><label>镜头</label><div><strong>${shot.id}</strong> · ${shot.type}</div></div>
            <div class="field">
              <label>${timingEditable ? "镜头时长" : "时长 / 镜头"}</label>
              ${timingEditable
                ? `<div class="storyboard-duration-editor"><input type="number" min="1" max="30" step="0.5" value="${seconds}" data-storyboard-duration="${shot.id}" aria-label="${shot.id} 镜头时长"><span>秒</span></div>`
                : `<div>${seconds} 秒 · ${shot.lens}</div>`}
            </div>
            ${timingEditable ? `<div class="field"><label>台词</label><div>${shot.dialogue || "无台词"}</div></div>` : ""}
            <div class="field"><label>运动</label><div>${shot.movement}</div></div>
            <div class="field"><label>画面内容</label><div>${shot.content}</div></div>
            <div class="field"><label>创作备注</label><div>${shot.note}</div></div>
            <div class="field"><label>脚本来源</label><div>${shot.source}</div></div>
          </div>
        </aside>
      `;
    }

    function renderStoryboardCards() {
      return `
        <div class="storyboard-card-grid">
          ${storyboardShots.map((shot) => `
            <button class="storyboard-card ${state.selectedStoryboardShot === shot.id ? "active" : ""}" type="button" data-storyboard-shot="${shot.id}">
              ${shotThumbnail(shot)}
              <span class="storyboard-card-body">
                <span class="shot-card-head"><span class="shot-number">${shot.id}</span>${statusChip(shot.type, "info")}</span>
                <span class="shot-card-copy">${shot.content}</span>
                <span class="shot-card-meta"><span>${storyboardShotSeconds(shot)} 秒</span><span>${shot.lens} · ${shot.movement}</span></span>
              </span>

        </div>
      `;
    }

    function renderStoryboardTable() {
      return `
        <table class="storyboard-table">
          <thead><tr><th>画面</th><th>镜号</th><th>景别</th><th>画面内容</th><th>时长</th><th>镜头 / 运动</th><th>来源</th></tr></thead>
          <tbody>
            ${storyboardShots.map((shot) => `
              <tr class="${state.selectedStoryboardShot === shot.id ? "active" : ""}" tabindex="0" data-storyboard-shot="${shot.id}">

                <td><strong>${shot.id}</strong></td>

                <td class="muted">${shot.source}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderAnimaticFrame(shot, time = state.storyboardPlaybackTime) {
      const localTime = Math.max(0, time - shot.start);
      return `
        <div class="animatic-frame-visual">${shotThumbnail(shot)}</div>
        <div class="animatic-frame-meta"><span>${shot.id}</span><span>${shot.type} · ${shot.movement}</span></div>
        ${shot.dialogue ? `<div class="animatic-dialogue">${shot.dialogue}</div>` : ""}
        <div class="animatic-frame-copy">
          <strong>${shot.content}</strong>
          <span>镜内 ${formatAnimaticTime(localTime)} / ${formatAnimaticTime(shot.seconds)}</span>
        </div>
      `;
    }

    function renderStoryboardLayout() {
      const sequence = storyboardSequence();
      const total = sequence.at(-1)?.end || 0;
      state.storyboardPlaybackTime = Math.min(state.storyboardPlaybackTime, total);
      const current = storyboardShotAtTime(state.storyboardPlaybackTime) || sequence[0];
      const marks = [];
      for (let second = 0; second < total; second += 2) marks.push(second);
      return `
        <div class="animatic-shell" data-animatic-shell>
          <div class="animatic-preview-area">
            <div class="animatic-canvas" data-animatic-canvas>${renderAnimaticFrame(current, state.storyboardPlaybackTime)}</div>
          </div>
          <div class="animatic-transport">
            <div class="animatic-transport-buttons">
              <button class="animatic-control" type="button" data-animatic-step="-1" title="上一个镜头" aria-label="上一个镜头">${icon("skip-back")}</button>
              <button class="animatic-control primary" type="button" data-animatic-toggle title="${state.storyboardPlaying ? "暂停" : "播放"}" aria-label="${state.storyboardPlaying ? "暂停" : "播放"}">${icon(state.storyboardPlaying ? "pause" : "play")}</button>
              <button class="animatic-control" type="button" data-animatic-step="1" title="下一个镜头" aria-label="下一个镜头">${icon("skip-forward")}</button>
            </div>
            <div class="animatic-timecode"><span data-animatic-current>${formatAnimaticTime(state.storyboardPlaybackTime)}</span> / <span>${formatAnimaticTime(total)}</span></div>
            <label class="animatic-scrubber">
              <input type="range" min="0" max="${total}" step="0.1" value="${state.storyboardPlaybackTime}" data-animatic-scrubber aria-label="分镜播放位置">
            </label>
            <span class="animatic-transport-note">分镜节奏预演</span>
          </div>
          <div class="animatic-timeline-scroll">
            <div class="animatic-timeline">
              <div class="animatic-track-stack">
                <span class="animatic-track-label ruler-label">时间</span>
                <span class="animatic-track-label video-label">画面</span>
                <span class="animatic-track-label dialogue-label">台词</span>
                <div class="animatic-ruler">
                  ${marks.map((mark, index) => {
                    const next = marks[index + 1] ?? total;
                    return `<span class="animatic-ruler-mark" style="width:${((next - mark) / total) * 100}%"><span>${formatAnimaticTime(mark)}</span></span>`;
                  }).join("")}
                </div>
                <div class="animatic-track animatic-video-track">
                  ${sequence.map((shot) => `
                    <button class="animatic-clip animatic-video-clip ${current.id === shot.id ? "active" : ""}" type="button" style="width:${(shot.seconds / total) * 100}%" data-animatic-shot="${shot.id}" data-shot-start="${shot.start}">
                      <strong>${shot.id}</strong><span>${shot.type} · ${shot.seconds} 秒</span>
                    </button>
                  `).join("")}
                </div>
                <div class="animatic-track animatic-dialogue-track">
                  ${sequence.map((shot) => `
                    <button class="animatic-clip animatic-dialogue-clip ${shot.dialogue ? "" : "empty"} ${current.id === shot.id ? "active" : ""}" type="button" style="width:${(shot.seconds / total) * 100}%" data-animatic-shot="${shot.id}" data-shot-start="${shot.start}">
                      ${shot.dialogue || "—"}
                    </button>
                  `).join("")}
                </div>
                <span class="animatic-playhead" style="left:${total ? (state.storyboardPlaybackTime / total) * 100 : 0}%" data-animatic-playhead></span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStoryboard() {
      const total = storyboardSequence().at(-1)?.end || 0;
      let selected = storyboardShots.find((shot) => shot.id === state.selectedStoryboardShot) || storyboardShots[0];
      if (state.storyboardView === "layout") {
        const current = storyboardShotAtTime(state.storyboardPlaybackTime);
        if (current) {
          selected = current;
          state.selectedStoryboardShot = current.id;
        }
      }
      const main = state.storyboardView === "table"
        ? renderStoryboardTable()
        : state.storyboardView === "layout"
          ? renderStoryboardLayout()
          : renderStoryboardCards();
      return `
        <section class="storyboard-workspace" aria-label="分镜工作区">
          <div class="storyboard-toolbar">
            <div class="storyboard-toolbar-copy">
              <strong>车站段落分镜 · v4</strong>
              <span>场 12 · ${storyboardShots.length} 个镜头 · 总时长 ${total} 秒</span>
            </div>
            <div class="storyboard-view-switch" role="group" aria-label="分镜视图">

              <button class="view-switch-button ${state.storyboardView === "layout" ? "active" : ""}" type="button" data-storyboard-view="layout">${icon("layout")}<span>Layout</span></button>
            </div>
          </div>
          <div class="storyboard-body">
            <div class="storyboard-main">${main}</div>
            ${renderStoryboardInspector(selected, state.storyboardView === "layout")}
          </div>
        </section>
      `;
    }

    function renderBreakdown() {
      const activeCategory = breakdownCategories.find((category) => category.id === state.breakdownCategory) || breakdownCategories[0];

      const pendingRows = categoryRows.filter((row) => !state.acceptedBreakdown.has(row.id));

      const allPendingSelected = pendingRows.length > 0 && pendingRows.every((row) => state.selectedBreakdown.has(row.id));
      const row = (item) => {
        const accepted = state.acceptedBreakdown.has(item.id);
        const selected = state.selectedBreakdown.has(item.id);
        return `
        <tr>
          <td><input type="checkbox" data-breakdown-check="${item.id}" aria-label="选择 ${item.item}" ${selected ? "checked" : ""} ${accepted ? "disabled" : ""}></td>

          <td><div>${item.preparation}</div><div class="row-meta"><span>${item.owner}</span></div></td>
          <td class="breakdown-source"><strong>${item.source}</strong><span>“${item.quote}”</span></td>
          <td><div class="breakdown-status-stack">${statusChip(`置信度 ${item.confidence}`, item.confidence === "高" ? "ok" : "warn")}${accepted ? statusChip("已确认", "ok") : statusChip(item.status, "warn")}</div></td>

        </tr>
      `;
      };
      return `
        ${pageHeader("项目空间", "制片拆解", "", `<button class="button" type="button" data-breakdown-confirm ${selectedRows.length ? "" : "disabled"}>确认选中（${selectedRows.length}）</button>`)}

            </div>
            <div class="breakdown-category-list" role="tablist" aria-label="制片拆解大类">
              ${breakdownCategories.map((category) => {
                const rows = breakdownRows.filter((item) => item.category === category.id);
                const pending = rows.filter((item) => !state.acceptedBreakdown.has(item.id)).length;
                return `
                  <button class="breakdown-category-button ${activeCategory.id === category.id ? "active" : ""}" type="button" role="tab" aria-selected="${activeCategory.id === category.id}" data-breakdown-category="${category.id}">
                    <span class="breakdown-category-copy"><strong>${category.label}</strong><span>${category.description}</span></span>
                    <span class="breakdown-category-count" title="${pending} 条待确认">${pending}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </aside>
          <div class="breakdown-category-content">
            <header class="breakdown-category-header">
              <div class="breakdown-category-title">
                <strong>${activeCategory.label}</strong>
                <span>${activeCategory.description} · ${pendingRows.length} 条待确认</span>
              </div>
              <div class="breakdown-category-actions">
                <span class="muted">已选 ${selectedRows.length} 条</span>
                <button class="ghost-button" type="button" data-breakdown-select-all ${pendingRows.length ? "" : "disabled"}>${allPendingSelected ? "取消全选" : "全选待确认"}</button>
              </div>
            </header>
            ${categoryRows.length ? `
              <div class="breakdown-table-wrap">
                <table class="breakdown-table">
                  <thead>
                    <tr>
                      <th style="width:40px"></th>
                      <th style="width:180px">候选需求</th>
                      <th style="width:220px">专业准备 / 负责部门</th>
                      <th style="width:230px">来源文档与原文</th>
                      <th style="width:120px">Agent 判断 / 状态</th>
                      <th style="width:80px">操作</th>
                    </tr>
                  </thead>
                  <tbody>${categoryRows.map(row).join("")}</tbody>
                </table>
              </div>
            ` : `
              <div class="breakdown-empty"><div><strong>暂无${activeCategory.label}候选</strong><span>已扫描拍摄稿 v7 与分镜 v4，未发现该类准备需求。</span></div></div>
            `}
          </div>
        </section>
      `;

            </div>
          </section>
        `;
      }

      const selectedAsset = reviewAssets.find((asset) => asset.id === state.reviewAsset) || reviewAssets[0];
      const selectedVersion = selectedAsset.version.startsWith("v") ? selectedAsset.version.split(" ")[0] : "v12";
      const durationSeconds = Number(selectedAsset.duration.split(":")[1]) || 30;
      state.reviewVersion = selectedVersion;
      state.reviewDuration = durationSeconds;
      state.reviewTime = Math.min(durationSeconds, Math.max(0, state.reviewTime));
      const folderAssets = reviewAssets.filter((asset) => asset.folderId === selectedAsset.folderId && asset.id !== selectedAsset.id);
      const compareAsset = selectedAsset.folderId === "main"
        ? (selectedVersion === "v12"
          ? reviewAssets.find((asset) => asset.id === "main-v11")
          : reviewAssets.find((asset) => asset.id === "main-v12"))
        : folderAssets[0];
      const versionComments = reviewComments.filter((comment) => comment.assetId === selectedAsset.id);
      const visibleComments = versionComments.filter((comment) => {
        if (state.reviewCommentFilter === "unresolved") return !comment.resolved;
        if (state.reviewCommentFilter === "mine") return comment.user === "繁星";
        return true;
      });
      const currentTime = formatReviewTime(state.reviewTime);
      const actions = `
        <button class="ghost-button" type="button" data-review-back>${icon("arrow-left")}<span>返回文件</span></button>
        <button class="button" type="button" data-review-compare>${state.compare ? "单版本" : "双版本对比"}</button>
      `;
      return `
        ${pageHeader("项目空间", "审片", "", actions)}
        <section class="review-workspace" aria-label="${selectedAsset.name} 审阅工作台">
          <div class="review-player-column">
            <div class="review-context-bar">
              <div class="review-context-copy">
                <strong>${selectedAsset.name}</strong>
                <span>${team.name} / ${project.name} · ${selectedAsset.duration} · ${selectedAsset.fps} · ${selectedAsset.type}</span>
              </div>

                ${reviewAssets.filter((asset) => asset.folderId === selectedAsset.folderId).map((asset) =>
                  `<option value="${asset.id}" data-duration="${Number(asset.duration.split(":")[1]) || 30}" ${asset.id === selectedAsset.id ? "selected" : ""}>${asset.version} · ${asset.updated}</option>`

                  <button class="review-annotation-tool ${state.reviewAnnotationMode === "region" ? "active" : ""}" type="button" data-review-annotation="region">${icon("grid")}<span>区域标注</span></button>
                  <button class="review-annotation-tool ${state.reviewAnnotationMode === "draw" ? "active" : ""}" type="button" data-review-annotation="draw">${icon("note")}<span>画面批注</span></button>
                </div>
                <div class="review-note-compose">
                  <input type="text" value="${currentTime}" aria-label="批注时间码" readonly>
                  <input type="text" placeholder="${state.reviewAnnotationMode === "comment" ? "输入审阅意见…" : "描述需要标注的画面区域…"}" aria-label="审阅意见">
                  <button class="button" type="button" data-toast="意见已绑定到 ${selectedVersion} 的 ${currentTime}">添加意见</button>
                </div>
              </div>
            </div>
          </div>
          <aside class="review-comments-panel">
            <div class="review-comments-head">
              <strong>所有意见</strong>
              <span class="muted">${versionComments.length} 条 · ${versionComments.filter((comment) => !comment.resolved).length} 条未解决</span>
            </div>
            <div class="review-comment-filters" role="tablist" aria-label="意见筛选">
              <button class="review-comment-filter ${state.reviewCommentFilter === "all" ? "active" : ""}" type="button" data-review-comment-filter="all">全部</button>
              <button class="review-comment-filter ${state.reviewCommentFilter === "unresolved" ? "active" : ""}" type="button" data-review-comment-filter="unresolved">未解决</button>
              <button class="review-comment-filter ${state.reviewCommentFilter === "mine" ? "active" : ""}" type="button" data-review-comment-filter="mine">我的</button>
            </div>
            <div class="review-comment-list">
              ${visibleComments.length ? visibleComments.map((comment) => `
                <button class="review-comment ${comment.resolved ? "resolved" : ""}" type="button" data-review-comment-time="${comment.seconds}" aria-label="跳转到 ${comment.time}">
                  <div class="comment-head"><strong>${comment.user}</strong><span>${comment.time}</span></div>
                  <p>${comment.text}</p>
                  <div class="review-comment-meta">
                    <span>${comment.replies ? `${comment.replies} 条回复` : "暂无回复"}</span>
                    <span>${comment.resolved ? "已解决" : "未解决"}</span>

    function updateReviewPlaybackDOM() {
      if (state.reviewMode !== "workspace") return;
      const duration = Math.max(0, Number(state.reviewDuration) || 30);
      state.reviewTime = Math.min(duration, Math.max(0, Number(state.reviewTime) || 0));
      const time = formatReviewTime(state.reviewTime);
      const readout = workspace.querySelector("[data-review-time]");
      const scrubber = workspace.querySelector("[data-review-scrubber]");
      const timeInput = workspace.querySelector(".review-note-compose input[readonly]");
      const toggle = workspace.querySelector("[data-review-play]");
      if (readout) readout.textContent = `${time} / ${formatReviewTime(duration)}`;
      if (scrubber) scrubber.value = String(state.reviewTime);
      if (timeInput) timeInput.value = time;
      if (toggle) {
        toggle.innerHTML = icon(state.reviewPlaying ? "pause" : "play");
        toggle.title = state.reviewPlaying ? "暂停" : "播放";
        toggle.setAttribute("aria-label", toggle.title);
      }
    }

    function stopReviewPlayback() {
      clearInterval(reviewPlaybackTimer);
      reviewPlaybackTimer = null;
      state.reviewPlaying = false;
      updateReviewPlaybackDOM();
    }

    function toggleReviewPlayback() {
      if (state.reviewPlaying) {
        stopReviewPlayback();
        return;
      }
      const duration = Math.max(0, Number(state.reviewDuration) || 30);
      if (!duration) return;
      if (state.reviewTime >= duration) state.reviewTime = 0;
      state.reviewPlaying = true;
      updateReviewPlaybackDOM();
      reviewPlaybackTimer = setInterval(() => {
        state.reviewTime = Math.min(duration, state.reviewTime + 0.1);
        if (state.reviewTime >= duration) {
          stopReviewPlayback();
          return;
        }
        updateReviewPlaybackDOM();
      }, 100);
    }

    function renderGuestReview() {
      const comments = [
        { time: "00:07.120", user: "客户", text: "开场可以再留 1 秒。" },

      return `

              <button class="mini-action" type="button">▶</button>
              <div class="timeline"></div>
              <span class="muted">00:18.420 / 00:30.000</span>
            </div>
          </div>
          <div class="comments">
            <div class="panel-title">审片反馈</div>
            ${comments.map((c) => `
              <div class="comment">

          </div>
        </div>
