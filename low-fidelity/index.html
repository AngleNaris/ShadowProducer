    function renderStateView() {
      const map = {
        loading: { code: "LOADING", title: "正在加载", desc: "正在获取工作区数据…", skeleton: true },
        empty: { code: "EMPTY", title: "暂无内容", desc: "当前范围内没有可展示的数据。" },
        "no-permission": { code: "403", title: "无访问权限", desc: "你没有访问当前团队或项目的权限。" },
        offline: { code: "OFFLINE", title: "网络不可用", desc: "当前处于离线或降级状态，已缓存数据可能过期。" },
        partial: { code: "PARTIAL", title: "部分数据加载失败", desc: "当前团队部分数据未能获取，其余内容仍可正常查看。" },
        expired: { code: "EXPIRED", title: "链接已失效", desc: "该审片链接已过期或被撤销。" }
      };
      const s = map[state.prototype];
      if (state.prototype === "partial") {
        return `
          <div class="notice partial">当前团队部分数据加载失败，其余内容仍可正常查看。<button class="mini-action" type="button" data-retry>重试</button></div>
          ${renderDashboard()}
        `;
      }
      if (s?.skeleton) {
        return `
          <div class="system-state">
            <div class="skeleton">
              <span></span><span></span><span></span>
            </div>
          </div>
        `;
      }
      return `
        <div class="system-state">
          <div>
            <div class="state-code">${s?.code || "STATE"}</div>
            <h2>${s?.title || "状态"}</h2>
            <p class="muted">${s?.desc || ""}</p>
          </div>
        </div>
      `;
    }

    function enhanceCollapsiblePanels() {
      workspace.querySelectorAll(".workspace-panel").forEach((panel, index) => {
        const head = panel.querySelector(":scope > .workspace-panel-head");
        if (!head) return;

        const title = head.querySelector("h2")?.textContent.trim() || panel.getAttribute("aria-label") || `面板 ${index + 1}`;
        const panelKey = `${state.teamId}:${state.view}:${title}:${index}`;
        const collapsed = state.collapsedPanels.has(panelKey);
        panel.dataset.panelId = panelKey;
        panel.classList.toggle("is-collapsed", collapsed);

        const titleBlock = head.firstElementChild;
        const actions = document.createElement("div");
        actions.className = "workspace-panel-head-actions";
        [...head.children].filter((child) => child !== titleBlock).forEach((child) => actions.appendChild(child));

        const toggle = document.createElement("button");
        toggle.className = "panel-collapse-toggle";
        toggle.type = "button";
        toggle.dataset.panelToggle = "";
        toggle.dataset.panelTitle = title;
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.setAttribute("aria-label", `${collapsed ? "展开" : "折叠"}${title}`);
        toggle.title = `${collapsed ? "展开" : "折叠"}${title}`;
        toggle.innerHTML = icon("chevron-down");
        actions.appendChild(toggle);
        head.appendChild(actions);
      });
    }

    function setWorkspaceContent(markup) {
      workspace.innerHTML = markup;
      enhanceCollapsiblePanels();
    }

    function render() {
      setActiveNav();
      syncContextDisplay();

      if (!state.teamId) {
        setWorkspaceContent(renderTeamSelection());
        return;
      }

      if (state.prototype !== "normal") {
        setWorkspaceContent(`<div class="page">${renderStateView()}</div>`);
        return;
      }

      let body = "";
      if (state.view === "dashboard") body = renderDashboard();
      else if (state.view === "calendar") body = renderCalendar();
      else if (state.view === "notes") body = renderNotesPage();
      else if (state.view === "personal-contacts") body = renderPersonalContacts();
      else if (state.view === "team") body = renderTeam();
      else if (state.view === "resources") body = renderResources();
      else if (state.view === "portfolio") body = renderPortfolio();
      else if (state.view === "project") body = renderProject();
      else if (state.view === "scripts") body = renderScripts();
      else if (state.view === "breakdown") body = renderBreakdown();
      else if (state.view === "schedule") body = renderSchedule();
      else if (state.view === "reviews") body = renderReviews();
      else body = renderDashboard();

      setWorkspaceContent(`<div class="page">${body}</div>`);
      if (state.view === "calendar") requestAnimationFrame(scrollCalendarToSelected);
    }

    const guestContent = document.getElementById("guestContent");

    function renderGuest() {
      guestContent.innerHTML = renderGuestReview();
    }

    function openModal(title, body, foot) {
      modalTitle.textContent = title;
      modalBody.innerHTML = body;
      modalFoot.innerHTML = foot || `<button class="ghost-button" type="button" data-modal-close>取消</button>`;
      modalBackdrop.classList.add("open");
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    let toastTimer = null;
    let scriptSaveTimer = null;
    let storyboardPlaybackTimer = null;
    let reviewPlaybackTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function currentTeamSignals() {
      return dashboardSignals.filter((signal) =>
        signal.teamId === state.teamId &&
        !state.dismissedDashboardSignals.has(signal.id)
      );
    }

    function updateNotificationButton() {
      const active = currentTeamSignals();
      notificationButton.classList.toggle("has-items", active.length > 0);
      notificationButton.title = active.length > 0 ? `${active.length} 条当前团队待处理事项` : "当前团队暂无待处理事项";
    }

    function jumpToSignal(id) {
      const signal = dashboardSignals.find((s) => s.id === id);
      if (!signal || (signal.teamId && signal.teamId !== state.teamId)) return;
      if (signal.projectId) rememberProjectVisit(signal.projectId);
      state.view = signal.view;
      location.hash = "#/" + hashForState();
      render();
    }

    function navigateToView(view, teamId, projectId, resourceTab = null) {
      if (!state.teamId) return;
      if (teamId && teamId !== state.teamId) {
        showToast("该内容属于其他团队，请先切换团队");
        return;
      }
      if (projectId && !currentTeam().projects.some((project) => project.id === projectId)) {
        showToast("该项目不属于当前团队，请先切换团队");
        return;
      }
      stopStoryboardPlayback();
      stopReviewPlayback();
      if (projectId) rememberProjectVisit(projectId);
      if (isPersonalView(view) || isTeamView(view) || isProjectView(view)) state.view = view;
      else state.view = "dashboard";
      if (state.view === "resources") {
        if (["contacts", "assets"].includes(resourceTab)) state.resourceTab = resourceTab;
        state.contactProjectFilter = projectId || "all";
      }
      normalizeContext();
      location.hash = "#/" + hashForState();
      render();
    }

    function openShareModal(contactId) {
      const contact = contacts.find((c) => c.id === contactId);
      if (!contact || contact.source !== "personal") return;
      const team = currentTeam();
      const fields = ["姓名", "电话", "邮箱", "备注"];
      const currentShare = contact.shares?.find((share) => share.teamId === team.id);
      const fieldChecks = fields.map((f) => `
        <label class="check-row">
          <input type="checkbox" ${!currentShare || shareAllowsField(currentShare, f) ? "checked" : ""} ${f === "姓名" ? "disabled" : ""} data-share-field="${f}">
          <span>${f}${f === "姓名" ? "（必需）" : ""}</span>
        </label>
      `).join("");
      openModal(
        `共享 ${contact.name} 给 ${team.name}`,
        `
          <p class="muted">选择允许团队读取的字段；共享不会转移所有权。</p>
          <div class="check-list">${fieldChecks}</div>
          <div class="risk-summary">
            <div>目标团队</div><div>${escapeHtml(team.name)}</div>
            <div>联系人</div><div>${escapeHtml(contact.name)}</div>
            <div>影响</div><div>团队可读取已勾选字段，并可按授权关联项目</div>
          </div>
        `,
        `
          <button class="ghost-button" type="button" data-modal-close>取消</button>
          <button class="button" type="button" data-share-confirm="${contact.id}">确认共享</button>
        `
      );
    }

    function openContactEditor(scope, contactId = "") {
      const contact = contactId ? contacts.find((item) => item.id === contactId) : null;
      const personalScope = scope === "personal";
      if (contact && (personalScope ? contact.source !== "personal" : contact.source !== "team")) return;
      const formTitle = contact
        ? `编辑${personalScope ? "个人" : "团队"}联系人`
        : `新建${personalScope ? "个人" : "团队"}联系人`;
      openModal(
        formTitle,
        `
          <form id="contactEditorForm" data-contact-editor-form data-contact-scope="${scope}" data-contact-id="${contact?.id || ""}">
            <div class="field">
              <label for="contactEditorName">姓名或机构</label>
              <input id="contactEditorName" name="name" type="text" maxlength="60" value="${escapeHtml(contact?.name || "")}" required>
            </div>
            <div class="field">
              <label for="contactEditorType">类型</label>
              <input id="contactEditorType" name="type" type="text" maxlength="60" value="${escapeHtml(contact?.type || "")}" placeholder="演员经纪、器材供应商…" required>
            </div>
            <div class="field">
              <label for="contactEditorPhone">电话</label>
              <input id="contactEditorPhone" name="phone" type="text" maxlength="40" value="${escapeHtml(contact?.phone || "")}">
            </div>
            <div class="field">
              <label for="contactEditorEmail">邮箱</label>
              <input id="contactEditorEmail" name="email" type="email" maxlength="100" value="${escapeHtml(contact?.email || "")}">
            </div>
            <div class="field">
              <label for="contactEditorNote">备注</label>
              <textarea id="contactEditorNote" name="note" maxlength="240">${escapeHtml(contact?.note || "")}</textarea>
            </div>
          </form>
        `,
        `
          <button class="ghost-button" type="button" data-modal-close>取消</button>
          <button class="button" type="submit" form="contactEditorForm">保存联系人</button>
        `
      );
      requestAnimationFrame(() => document.getElementById("contactEditorName")?.focus());
    }

    function saveContactForm(form) {
      const formData = new FormData(form);
      const scope = form.dataset.contactScope;
      const contactId = form.dataset.contactId;
      const values = {
        name: String(formData.get("name") || "").trim(),
        type: String(formData.get("type") || "").trim(),
        phone: String(formData.get("phone") || "").trim(),
        email: String(formData.get("email") || "").trim(),
        note: String(formData.get("note") || "").trim()
      };
      if (!values.name || !values.type) return;
      let contact = contactId ? contacts.find((item) => item.id === contactId) : null;
      if (contact) {
        Object.assign(contact, values);
      } else {
        const personalScope = scope === "personal";
        contact = {
          id: `${personalScope ? "personal" : `team-${state.teamId}`}-${Date.now()}`,
          ...values,
          owner: personalScope ? "繁星" : currentTeam().name,
          source: personalScope ? "personal" : "team",
          fields: personalScope ? "全部个人字段" : "全部团队业务字段",
          projectIds: [],
          ...(personalScope ? { shares: [] } : { teamId: state.teamId })
        };
        contacts.push(contact);
      }
      state.selectedContact = contact.id;
      state.view = scope === "personal" ? "personal-contacts" : "resources";
      if (scope === "team") state.resourceTab = "contacts";
      closeModal();
      location.hash = "#/" + hashForState();
      render();
      showToast(contactId ? "联系人已更新" : "联系人已创建");
    }

    function confirmBreakdown() {
      const activeCategory = breakdownCategories.find((category) => category.id === state.breakdownCategory) || breakdownCategories[0];
      const selected = breakdownRows.filter((item) =>
        item.category === activeCategory.id &&
        state.selectedBreakdown.has(item.id) &&
        !state.acceptedBreakdown.has(item.id)
      );
      if (selected.length === 0) {
        showToast(`请先选择${activeCategory.label}候选`);
        return;
      }
      openModal(
        `确认${activeCategory.label}候选`,
        `
          <div class="detail-stack">
            <div class="field"><label>目标项目</label><div>${currentTeam().name} / ${currentProject().name}</div></div>
            <div class="field"><label>执行命令</label><div>确认 ${activeCategory.label}候选</div></div>
            <div class="field"><label>影响范围</label><div>${selected.length} 条候选将进入正式制片清单，可在后续流程修改或标记不需要。</div></div>
          </div>
          <div class="list">
            ${selected.map((item) => `<div class="list-row"><div class="row-main"><div class="row-title">${item.item}</div><div class="row-meta">${item.source}</div></div>${statusChip(item.type, "info")}</div>`).join("")}
          </div>
        `,
        `
          <button class="ghost-button" type="button" data-modal-close>取消</button>
          <button class="button" type="button" data-breakdown-confirm-go>确认 ${selected.length} 条</button>
        `
      );
    }

    function openBreakdownSource(rowId) {
      const item = breakdownRows.find((row) => row.id === rowId);
      if (!item) return;
      openModal(
        "候选来源",
        `
          <div class="detail-stack">
            <div class="field"><label>候选需求</label><div><strong>${item.item}</strong> · ${item.type}</div></div>
            <div class="field"><label>不可变来源版本</label><div>${item.source}</div></div>
            <div class="field"><label>原文位置</label><div>“${item.quote}”</div></div>
            <div class="field"><label>Agent 判断</label><div>置信度 ${item.confidence} · 等待人工确认</div></div>
          </div>
        `,
        `<button class="button" type="button" data-modal-close>关闭</button>`
      );
    }

    function agentWriteRisk(message) {
      const targetProject = state.agentWriteProjectId || null;
      const resolved = targetProject ? projectById(targetProject) : null;
      const canConfirm = Boolean(targetProject && resolved);
      const targetLabel = resolved ? `${resolved.teamName} / ${resolved.name}` : "尚未指定";
      const projectOptions = allProjects().map((p) =>
        `<option value="${p.id}" ${targetProject === p.id ? "selected" : ""}>${p.teamName} / ${p.name}</option>`
      ).join("");
      openModal(
        "高风险操作确认",
        `
          <p class="muted">Agent 与繁星本人权限一致，执行前将按最新权限重新鉴权。</p>
          <div class="risk-summary">
            <div>授权主体</div><div>繁星</div>
            <div>当前浏览范围</div><div>${scopeLabel()}</div>
            <div>写入目标项目</div><div>
              <select id="agentWriteProjectSelect" data-agent-write-project style="width:100%">
                <option value="">选择唯一项目</option>
                ${projectOptions}
              </select>
            </div>
            <div>影响范围</div><div>${message}</div>
          </div>
        `,
        `
          <button class="ghost-button" type="button" data-modal-close>取消</button>
          <button class="button" type="button" data-agent-confirm ${canConfirm ? "" : "disabled"}>确认执行</button>
        `
      );
    }

    function openAgent() {
      state.agentOpen = true;
      app.classList.add("agent-open");
    }

    function closeAgent() {
      state.agentOpen = false;
      app.classList.remove("agent-open");
    }

    function markScriptDirty(editor) {
      state.scriptDraft = editor.innerText.replace(/\u00a0/g, " ");
      state.scriptSaveState = "有未保存修改";
      const saveState = workspace.querySelector("[data-script-save-state]");
      if (saveState) {
        saveState.textContent = state.scriptSaveState;
        saveState.classList.add("unsaved");
      }
      clearTimeout(scriptSaveTimer);
      scriptSaveTimer = setTimeout(() => {
        state.scriptSaveState = "已自动保存";
        const currentSaveState = workspace.querySelector("[data-script-save-state]");
        if (currentSaveState) {
          currentSaveState.textContent = state.scriptSaveState;
          currentSaveState.classList.remove("unsaved");
        }
      }, 900);
    }

    function updateAnimaticPlaybackDOM() {
      const shell = workspace.querySelector("[data-animatic-shell]");
      if (!shell) return;
      const sequence = storyboardSequence();
      const total = sequence.at(-1)?.end || 0;
      state.storyboardPlaybackTime = Math.min(Math.max(0, state.storyboardPlaybackTime), total);
      const current = storyboardShotAtTime(state.storyboardPlaybackTime) || sequence[0];
      if (!current) return;
      state.selectedStoryboardShot = current.id;

      const canvas = shell.querySelector("[data-animatic-canvas]");
      if (canvas) canvas.innerHTML = renderAnimaticFrame(current, state.storyboardPlaybackTime);

      const currentTime = shell.querySelector("[data-animatic-current]");
      if (currentTime) currentTime.textContent = formatAnimaticTime(state.storyboardPlaybackTime);

      const scrubber = shell.querySelector("[data-animatic-scrubber]");
      if (scrubber) scrubber.value = String(state.storyboardPlaybackTime);

      const playhead = shell.querySelector("[data-animatic-playhead]");
      if (playhead) playhead.style.left = `${total ? (state.storyboardPlaybackTime / total) * 100 : 0}%`;

      shell.querySelectorAll("[data-animatic-shot]").forEach((clip) => {
        clip.classList.toggle("active", clip.dataset.animaticShot === current.id);
      });

      const inspector = workspace.querySelector("[data-storyboard-inspector]");
      if (inspector && inspector.dataset.storyboardShotId !== current.id) {
        inspector.outerHTML = renderStoryboardInspector(current, true);
      }

      const toggle = shell.querySelector("[data-animatic-toggle]");
      if (toggle) {
        toggle.innerHTML = icon(state.storyboardPlaying ? "pause" : "play");
        toggle.title = state.storyboardPlaying ? "暂停" : "播放";
        toggle.setAttribute("aria-label", toggle.title);
      }
    }

    function stopStoryboardPlayback() {
      clearInterval(storyboardPlaybackTimer);
      storyboardPlaybackTimer = null;
      state.storyboardPlaying = false;
      updateAnimaticPlaybackDOM();
    }

    function toggleStoryboardPlayback() {
      if (state.storyboardPlaying) {
        stopStoryboardPlayback();
        return;
      }
      const total = storyboardSequence().at(-1)?.end || 0;
      if (!total) return;
      if (state.storyboardPlaybackTime >= total) state.storyboardPlaybackTime = 0;
      state.storyboardPlaying = true;
      updateAnimaticPlaybackDOM();
      storyboardPlaybackTimer = setInterval(() => {
        state.storyboardPlaybackTime = Math.min(total, state.storyboardPlaybackTime + 0.1);
        if (state.storyboardPlaybackTime >= total) {
          stopStoryboardPlayback();
          return;
        }
        updateAnimaticPlaybackDOM();
      }, 100);
    }

    function stepAnimaticShot(direction) {
      const sequence = storyboardSequence();
      const current = storyboardShotAtTime(state.storyboardPlaybackTime) || sequence[0];
      const currentIndex = Math.max(0, sequence.findIndex((shot) => shot.id === current?.id));
      const target = sequence[Math.min(sequence.length - 1, Math.max(0, currentIndex + direction))];
      if (!target) return;
      stopStoryboardPlayback();
      state.selectedStoryboardShot = target.id;
      state.storyboardPlaybackTime = target.start;
      render();
    }

    // ===== Event delegation =====
    workspace.addEventListener("mousedown", (event) => {
      if (event.target.closest("[data-script-command]")) event.preventDefault();
    });

    workspace.addEventListener("click", (event) => {
      const animaticToggle = event.target.closest("[data-animatic-toggle]");
      if (animaticToggle) {
        toggleStoryboardPlayback();
        return;
      }

      const animaticStep = event.target.closest("[data-animatic-step]");
      if (animaticStep) {
        stepAnimaticShot(Number(animaticStep.dataset.animaticStep));
        return;
      }

      const animaticShot = event.target.closest("[data-animatic-shot]");
      if (animaticShot) {
        stopStoryboardPlayback();
        state.selectedStoryboardShot = animaticShot.dataset.animaticShot;
        state.storyboardPlaybackTime = Number(animaticShot.dataset.shotStart) || 0;
        render();
        return;
      }

      const scriptsTab = event.target.closest("[data-scripts-tab]");
      if (scriptsTab) {
        stopStoryboardPlayback();
        state.scriptsTab = scriptsTab.dataset.scriptsTab;
        render();
        return;
      }

      const scheduleTab = event.target.closest("[data-schedule-tab]");
      if (scheduleTab) {
        state.scheduleTab = scheduleTab.dataset.scheduleTab;
        render();
        return;
      }

      const callSheet = event.target.closest("[data-call-sheet]");
      if (callSheet) {
        state.selectedCallSheet = callSheet.dataset.callSheet;
        render();
        return;
      }

      const scriptVersion = event.target.closest("[data-script-version]");
      if (scriptVersion) {
        state.scriptVersion = scriptVersion.dataset.scriptVersion;
        state.scriptSaveState = "已自动保存";
        render();
        return;
      }

      const storyboardView = event.target.closest("[data-storyboard-view]");
      if (storyboardView) {
        stopStoryboardPlayback();
        state.storyboardView = storyboardView.dataset.storyboardView;
        render();
        return;
      }

      const storyboardShot = event.target.closest("[data-storyboard-shot]");
      if (storyboardShot) {
        stopStoryboardPlayback();
        state.selectedStoryboardShot = storyboardShot.dataset.storyboardShot;
        render();
        return;
      }

      const scriptCommand = event.target.closest("[data-script-command]");
      if (scriptCommand) {
        if (state.scriptVersion !== "v7") {
          showToast("历史版本为只读，请切回 v7 编辑");
          return;
        }
        const editor = workspace.querySelector("[data-script-editor]");
        if (editor) {
          editor.focus();
          document.execCommand(scriptCommand.dataset.scriptCommand, false);
          markScriptDirty(editor);
        }
        return;
      }

      const scriptCommentNew = event.target.closest("[data-script-comment-new]");
      if (scriptCommentNew) {
        openModal(
          "添加脚本评论",
          `<div class="field"><label for="scriptCommentDraft">评论</label><textarea id="scriptCommentDraft" placeholder="说明需要讨论的台词、动作或场次问题"></textarea></div><p class="muted">评论将绑定到冬夜咖啡_拍摄稿 ${state.scriptVersion} 的当前选区。</p>`,
          `<button class="ghost-button" type="button" data-modal-close>取消</button><button class="button" type="button" data-script-comment-submit>发布评论</button>`
        );
        return;
      }

      const scriptComment = event.target.closest("[data-script-comment]");
      if (scriptComment) {
        const commentBody = scriptComment.dataset.scriptComment === "dialogue"
          ? "“不会再错过”是否需要更克制一点？"
          : "建议补充列车灯出现的具体时机。";
        openModal(
          "脚本评论",
          `<p>${commentBody}</p><p class="muted">绑定位置：拍摄稿 v7 · 场 12</p><div class="field"><label for="scriptCommentReply">回复</label><textarea id="scriptCommentReply" placeholder="回复协作者"></textarea></div>`,
          `<button class="ghost-button" type="button" data-modal-close>关闭</button><button class="button" type="button" data-script-comment-submit>回复并解决</button>`
        );
        return;
      }

      const calendarEvent = event.target.closest("[data-calendar-event]");
      if (calendarEvent) {
        openCalendarEvent(calendarEvent.dataset.calendarEvent, calendarEvent.dataset.calendarEventDate);
        return;
      }

      const panelToggle = event.target.closest("[data-panel-toggle]");
      if (panelToggle) {
        const panel = panelToggle.closest(".workspace-panel");
        const collapsed = panel.classList.toggle("is-collapsed");
        if (collapsed) state.collapsedPanels.add(panel.dataset.panelId);
        else state.collapsedPanels.delete(panel.dataset.panelId);
        const title = panelToggle.dataset.panelTitle;
        panelToggle.setAttribute("aria-expanded", String(!collapsed));
        panelToggle.setAttribute("aria-label", `${collapsed ? "展开" : "折叠"}${title}`);
        panelToggle.title = `${collapsed ? "展开" : "折叠"}${title}`;
        return;
      }

      const nav = event.target.closest("[data-nav]");
      if (nav) {
        const targetTeam = nav.dataset.targetTeam;
        const targetProject = nav.dataset.targetProject && nav.dataset.targetProject !== "undefined"
          ? nav.dataset.targetProject
          : null;
        if (targetTeam && targetTeam !== state.teamId) {
          showToast("该内容属于其他团队，请先切换团队");
          return;
        }
        navigateToView(nav.dataset.nav, targetTeam, targetProject, nav.dataset.resourceTabTarget);
        return;
      }

      const teamSelect = event.target.closest("[data-team-select]");
      if (teamSelect) {
        selectTeam(teamSelect.dataset.teamSelect);
        return;
      }

      const teamMenuAction = event.target.closest("[data-team-menu-action]");
      if (teamMenuAction) {
        if (teamMenuAction.dataset.teamMenuAction === "select") returnToTeamSelection();
        if (teamMenuAction.dataset.teamMenuAction === "settings") navigateToView("team");
        return;
      }

      const boardStatus = event.target.closest("[data-board-status]");
      if (boardStatus) {
        state.boardStatusFilter = boardStatus.dataset.boardStatus;
        render();
        return;
      }

      const notesFilter = event.target.closest("[data-notes-filter]");
      if (notesFilter) {
        state.notesFilter = notesFilter.dataset.notesFilter;
        refreshNotesResults();
        return;
      }

      const calendarDate = event.target.closest("[data-calendar-date]");
      if (calendarDate) {
        selectCalendarDate(calendarDate.dataset.calendarDate);
        return;
      }

      const calendarShift = event.target.closest("[data-calendar-shift]");
      if (calendarShift) {
        const target = new Date(state.calendarYear, state.calendarMonth + Number(calendarShift.dataset.calendarShift), 1);
        const selectedDay = dateFromKey(state.calendarSelectedDate).getDate();
        const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
        state.calendarYear = target.getFullYear();
        state.calendarMonth = target.getMonth();
        state.calendarSelectedDate = formatDateKey(new Date(state.calendarYear, state.calendarMonth, Math.min(selectedDay, lastDay)));
        render();
        return;
      }

      const calendarToday = event.target.closest("[data-calendar-today]");
      if (calendarToday) {
        const today = dateFromKey(CALENDAR_TODAY);
        state.calendarYear = today.getFullYear();
        state.calendarMonth = today.getMonth();
        state.calendarSelectedDate = CALENDAR_TODAY;
        render();
        return;
      }

      const noteNew = event.target.closest("[data-note-new]");
      if (noteNew) {
        showToast("已新建便签草稿，可交给 Agent 继续整理");
        return;
      }

      const noteOpen = event.target.closest("[data-note-open]");
      if (noteOpen) {
        const note = personalNotes.find((item) => item.id === noteOpen.dataset.noteOpen);
        if (note) {
          state.selectedNote = note.id;
          openModal(note.title, `<p>${note.preview}</p><p class="muted">${note.meta}</p>`, `<button class="ghost-button" type="button" data-modal-close>关闭</button><button class="button" type="button" data-agent-prompt="整理便签：${note.title}">交给 Agent</button>`);
        }
        return;
      }

      const jump = event.target.closest("[data-signal-jump]");
      if (jump) {
        jumpToSignal(jump.dataset.signalJump);
        return;
      }

      const shoot = event.target.closest("[data-shoot-jump]");
      if (shoot) {
        navigateToView(shoot.dataset.shootJump, shoot.dataset.targetTeam, shoot.dataset.targetProject);
        return;
      }

      const contactSelect = event.target.closest("[data-contact-select]");
      if (contactSelect) {
        state.selectedContact = contactSelect.dataset.contactSelect;
        render();
        return;
      }

      const contactShare = event.target.closest("[data-contact-share]");
      if (contactShare) {
        openShareModal(contactShare.dataset.contactShare);
        return;
      }

      const contactCreate = event.target.closest("[data-contact-create]");
      if (contactCreate) {
        openContactEditor(contactCreate.dataset.contactCreate);
        return;
      }

      const contactEdit = event.target.closest("[data-contact-edit]");
      if (contactEdit) {
        openContactEditor(contactEdit.dataset.contactScope, contactEdit.dataset.contactEdit);
        return;
      }

      const confirmBtn = event.target.closest("[data-breakdown-confirm]");
      if (confirmBtn) {
        confirmBreakdown();
        return;
      }

      const breakdownCategory = event.target.closest("[data-breakdown-category]");
      if (breakdownCategory) {
        state.breakdownCategory = breakdownCategory.dataset.breakdownCategory;
        render();
        return;
      }

      const breakdownSelectAll = event.target.closest("[data-breakdown-select-all]");
      if (breakdownSelectAll) {
        const pending = breakdownRows.filter((item) =>
          item.category === state.breakdownCategory &&
          !state.acceptedBreakdown.has(item.id)
        );
        const allSelected = pending.length > 0 && pending.every((item) => state.selectedBreakdown.has(item.id));
        pending.forEach((item) => {
          if (allSelected) state.selectedBreakdown.delete(item.id);
          else state.selectedBreakdown.add(item.id);
        });
        render();
        return;
      }

      const breakdownSource = event.target.closest("[data-breakdown-source]");
      if (breakdownSource) {
        openBreakdownSource(breakdownSource.dataset.breakdownSource);
        return;
      }

      const resourceTab = event.target.closest("[data-resource-tab]");
      if (resourceTab) {
        state.resourceTab = resourceTab.dataset.resourceTab;
        render();
        return;
      }

      const reviewFolder = event.target.closest("[data-review-folder]");
      if (reviewFolder) {
        stopReviewPlayback();
        state.reviewFolder = reviewFolder.dataset.reviewFolder;
        state.reviewMode = "browser";
        state.reviewQuery = "";
        render();
        return;
      }

      const reviewOpen = event.target.closest("[data-review-open]");
      if (reviewOpen) {
        stopReviewPlayback();
        state.reviewAsset = reviewOpen.dataset.reviewOpen;
        state.reviewMode = "workspace";
        state.reviewCommentFilter = "all";
        state.reviewAnnotationMode = "comment";
        state.reviewDuration = Number(reviewOpen.dataset.reviewDuration) || 30;
        state.reviewTime = Math.min(18.42, state.reviewDuration);
        state.compare = false;
        render();
        return;
      }

      const reviewBack = event.target.closest("[data-review-back]");
      if (reviewBack) {
        stopReviewPlayback();
        state.reviewMode = "browser";
        state.compare = false;
        render();
        return;
      }

      const reviewCompare = event.target.closest("[data-review-compare]");
      if (reviewCompare) {
        state.compare = !state.compare;
        render();
        return;
      }

      const reviewPlay = event.target.closest("[data-review-play]");
      if (reviewPlay) {
        toggleReviewPlayback();
        return;
      }

      const reviewSeek = event.target.closest("[data-review-seek]");
      if (reviewSeek) {
        stopReviewPlayback();
        state.reviewTime = Math.min(state.reviewDuration, Math.max(0, state.reviewTime + Number(reviewSeek.dataset.reviewSeek)));
        updateReviewPlaybackDOM();
        return;
      }

      const reviewAnnotation = event.target.closest("[data-review-annotation]");
      if (reviewAnnotation) {
        state.reviewAnnotationMode = reviewAnnotation.dataset.reviewAnnotation;
        render();
        return;
      }

      const reviewCommentFilter = event.target.closest("[data-review-comment-filter]");
      if (reviewCommentFilter) {
        state.reviewCommentFilter = reviewCommentFilter.dataset.reviewCommentFilter;
        render();
        return;
      }

      const reviewCommentTime = event.target.closest("[data-review-comment-time]");
      if (reviewCommentTime) {
        stopReviewPlayback();
        state.reviewTime = Number(reviewCommentTime.dataset.reviewCommentTime) || 0;
        updateReviewPlaybackDOM();
        return;
      }

      const todayScroll = event.target.closest("[data-gantt-today-scroll]");
      if (todayScroll) {
        scrollGanttToToday();
        return;
      }
    });

    workspace.addEventListener("dblclick", (event) => {
      if (event.target.closest("[data-calendar-event]")) return;
      const calendarDate = event.target.closest("[data-calendar-date]");
      if (!calendarDate) return;
      const dateKey = calendarDate.dataset.calendarDate;
      selectCalendarDate(dateKey);
      openCalendarDay(dateKey);
    });

    workspace.addEventListener("contextmenu", (event) => {
      const calendarDate = event.target.closest("[data-calendar-date]");
      if (!calendarDate) return;
      event.preventDefault();
      const dateKey = calendarDate.dataset.calendarDate;
      selectCalendarDate(dateKey);
      openCalendarContextMenu(dateKey, event.clientX, event.clientY);
    });

    workspace.addEventListener("keydown", (event) => {
      const storyboardShot = event.target.closest("tr[data-storyboard-shot]");
      if (storyboardShot && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        state.selectedStoryboardShot = storyboardShot.dataset.storyboardShot;
        render();
        return;
      }

      if (event.target.closest("[data-calendar-event]")) return;
      const calendarDate = event.target.closest("[data-calendar-date]");
      if (!calendarDate) return;
      const dateKey = calendarDate.dataset.calendarDate;
      if (event.key === "Enter") {
        event.preventDefault();
        selectCalendarDate(dateKey);
        openCalendarDay(dateKey);
        return;
      }
      if (event.key === " ") {
        event.preventDefault();
        selectCalendarDate(dateKey);
        return;
      }
      if (event.key === "F10" && event.shiftKey) {
        event.preventDefault();
        const rect = calendarDate.getBoundingClientRect();
        selectCalendarDate(dateKey);
        openCalendarContextMenu(dateKey, rect.left + 12, rect.top + 12);
      }
    });

    workspace.addEventListener("change", (event) => {
      const reviewVersion = event.target.closest("[data-review-version]");
      if (reviewVersion) {
        stopReviewPlayback();
        state.reviewAsset = reviewVersion.value;
        state.reviewDuration = Number(reviewVersion.selectedOptions[0]?.dataset.duration) || 30;
        state.reviewTime = Math.min(state.reviewTime, state.reviewDuration);
        state.compare = false;
        render();
        return;
      }

      const reviewScrubber = event.target.closest("[data-review-scrubber]");
      if (reviewScrubber) {
        stopReviewPlayback();
        state.reviewTime = Number(reviewScrubber.value) || 0;
        updateReviewPlaybackDOM();
        return;
      }

      const animaticScrubber = event.target.closest("[data-animatic-scrubber]");
      if (animaticScrubber) {
        render();
        return;
      }

      const storyboardDuration = event.target.closest("[data-storyboard-duration]");
      if (storyboardDuration) {
        const seconds = Math.min(30, Math.max(1, Number(storyboardDuration.value) || 1));
        stopStoryboardPlayback();
        state.storyboardDurationOverrides[storyboardDuration.dataset.storyboardDuration] = seconds;
        state.selectedStoryboardShot = storyboardDuration.dataset.storyboardDuration;
        const selected = storyboardSequence().find((shot) => shot.id === state.selectedStoryboardShot);
        state.storyboardPlaybackTime = selected?.start || 0;
        render();
        return;
      }

      const projectFilter = event.target.closest("[data-board-project-filter]");
      if (projectFilter) {
        state.boardProjectFilter = projectFilter.value;
        render();
        requestAnimationFrame(scrollGanttToToday);
        return;
      }

      const contactProjectFilter = event.target.closest("[data-contact-project-filter]");
      if (contactProjectFilter) {
        state.contactProjectFilter = contactProjectFilter.value;
        render();
        return;
      }

      const breakdownCheck = event.target.closest("[data-breakdown-check]");
      if (breakdownCheck) {
        if (breakdownCheck.checked) state.selectedBreakdown.add(breakdownCheck.dataset.breakdownCheck);
        else state.selectedBreakdown.delete(breakdownCheck.dataset.breakdownCheck);
        render();
        return;
      }

    });

    document.addEventListener("submit", (event) => {
      const contactForm = event.target.closest("[data-contact-editor-form]");
      if (contactForm) {
        event.preventDefault();
        saveContactForm(contactForm);
        return;
      }

      const calendarForm = event.target.closest("[data-calendar-create-form]");
      if (!calendarForm) return;
      event.preventDefault();
      createCalendarEvent(calendarForm);
    });

    workspace.addEventListener("input", (event) => {
      const reviewSearch = event.target.closest("[data-review-search]");
      if (reviewSearch) {
        state.reviewQuery = reviewSearch.value;
        const query = state.reviewQuery.trim().toLowerCase();
        workspace.querySelectorAll("[data-review-search-row]").forEach((row) => {
          row.hidden = Boolean(query) && !row.dataset.reviewSearchText.includes(query);
        });
        return;
      }

      const reviewScrubber = event.target.closest("[data-review-scrubber]");
      if (reviewScrubber) {
        state.reviewTime = Number(reviewScrubber.value) || 0;
        state.reviewPlaying = false;
        const time = formatReviewTime(state.reviewTime);
        const readout = workspace.querySelector("[data-review-time]");
        const timeInput = workspace.querySelector(".review-note-compose input[readonly]");
        if (readout) readout.textContent = `${time} / ${formatReviewTime(state.reviewDuration)}`;
        if (timeInput) timeInput.value = time;
        return;
      }

      const animaticScrubber = event.target.closest("[data-animatic-scrubber]");
      if (animaticScrubber) {
        stopStoryboardPlayback();
        state.storyboardPlaybackTime = Number(animaticScrubber.value) || 0;
        const current = storyboardShotAtTime(state.storyboardPlaybackTime);
        if (current) state.selectedStoryboardShot = current.id;
        updateAnimaticPlaybackDOM();
        return;
      }

      const scriptEditor = event.target.closest("[data-script-editor]");
      if (scriptEditor) {
        markScriptDirty(scriptEditor);
        return;
      }

      const notesSearch = event.target.closest("[data-notes-search]");
      if (!notesSearch) return;
      state.notesQuery = notesSearch.value;
      refreshNotesResults();
    });

    document.addEventListener("input", (event) => {
      const projectMenuSearch = event.target.closest("[data-project-menu-search]");
      if (!projectMenuSearch) return;
      state.projectMenuQuery = projectMenuSearch.value;
      refreshProjectMenuResults();
    });

    document.addEventListener("change", (event) => {
      const agentWriteProject = event.target.closest("[data-agent-write-project]");
      if (agentWriteProject) {
        state.agentWriteProjectId = agentWriteProject.value || null;
        const confirm = modalFoot.querySelector("[data-agent-confirm]");
        if (confirm) confirm.disabled = !agentWriteProject.value;
        return;
      }
    });

    document.addEventListener("click", (event) => {
      const calendarListEvent = event.target.closest("[data-calendar-list-event]");
      if (calendarListEvent) {
        openCalendarEvent(calendarListEvent.dataset.calendarListEvent, calendarListEvent.dataset.calendarEventDate);
        return;
      }

      const calendarNewFromContext = event.target.closest("[data-calendar-new-from-context]");
      if (calendarNewFromContext) {
        const dateKey = state.calendarContextDate || state.calendarSelectedDate;
        closeCalendarContextMenu();
        openCalendarCreateDialog(dateKey);
        return;
      }

      const calendarNewFromDay = event.target.closest("[data-calendar-new-from-day]");
      if (calendarNewFromDay) {
        openCalendarCreateDialog(calendarNewFromDay.dataset.calendarNewFromDay);
        return;
      }

      const calendarOpenRelated = event.target.closest("[data-calendar-open-related]");
      if (calendarOpenRelated) {
        const calendarEvent = calendarEventById(calendarOpenRelated.dataset.calendarOpenRelated);
        if (calendarEvent) {
          closeModal();
          navigateToView(calendarEvent.view, calendarEvent.teamId, calendarEvent.projectId, calendarEvent.resourceTab);
        }
        return;
      }

      const teamMenuAction = event.target.closest("[data-team-menu-action]");
      if (teamMenuAction) {
        if (teamMenuAction.dataset.teamMenuAction === "select") returnToTeamSelection();
        if (teamMenuAction.dataset.teamMenuAction === "settings") navigateToView("team");
        return;
      }

      const dismiss = event.target.closest("[data-signal-dismiss]");
      if (dismiss) {
        state.dismissedDashboardSignals.add(dismiss.dataset.signalDismiss);
        updateNotificationButton();
        render();
        return;
      }

      const modalClose = event.target.closest("[data-modal-close]");
      if (modalClose) {
        closeModal();
        return;
      }

      const scriptCommentSubmit = event.target.closest("[data-script-comment-submit]");
      if (scriptCommentSubmit) {
        closeModal();
        showToast("评论已同步给当前协作者");
        return;
      }

      const shareConfirm = event.target.closest("[data-share-confirm]");
      if (shareConfirm) {
        const contact = contacts.find((item) =>
          item.id === shareConfirm.dataset.shareConfirm && item.source === "personal"
        );
        if (!contact) return;
        const selectedFields = [...modalBody.querySelectorAll("[data-share-field]:checked")]
          .map((field) => field.dataset.shareField)
          .filter(Boolean);
        if (!selectedFields.includes("姓名")) selectedFields.unshift("姓名");
        contact.shares = Array.isArray(contact.shares) ? contact.shares : [];
        const existingIndex = contact.shares.findIndex((share) => share.teamId === state.teamId);
        const existingShare = existingIndex >= 0 ? contact.shares[existingIndex] : null;
        const nextShare = {
          teamId: state.teamId,
          fields: selectedFields.join("、"),
          allowProjectLink: existingShare?.allowProjectLink ?? true
        };
        if (existingIndex >= 0) contact.shares.splice(existingIndex, 1, nextShare);
        else contact.shares.push(nextShare);
        state.selectedContact = contact.id;
        closeModal();
        render();
        showToast("共享已生效：团队仅能读取你勾选的字段");
        return;
      }

      const breakdownGo = event.target.closest("[data-breakdown-confirm-go]");
      if (breakdownGo) {
        const activeCategory = breakdownCategories.find((category) => category.id === state.breakdownCategory) || breakdownCategories[0];
        const selected = breakdownRows.filter((item) =>
          item.category === activeCategory.id &&
          state.selectedBreakdown.has(item.id) &&
          !state.acceptedBreakdown.has(item.id)
        );
        selected.forEach((item) => {
          state.acceptedBreakdown.add(item.id);
          state.selectedBreakdown.delete(item.id);
        });
        closeModal();
        render();
        showToast(`已确认 ${selected.length} 条${activeCategory.label}候选`);
        return;
      }

      const agentConfirm = event.target.closest("[data-agent-confirm]");
      if (agentConfirm) {
        closeModal();
        showToast("已进入影响确认；写入将按最新权限重新鉴权");
        return;
      }

      const retry = event.target.closest("[data-retry]");
      if (retry) {
        state.prototype = "normal";
        render();
        return;
      }
    });

    document.addEventListener("click", (event) => {
      const toastBtn = event.target.closest("[data-toast]");
      if (toastBtn) {
        showToast(toastBtn.dataset.toast);
        return;
      }

      const projectSwitch = event.target.closest("[data-project-switch]");
      if (projectSwitch) {
        switchTopProject(projectSwitch.dataset.projectSwitch);
        return;
      }

      const projectMenuFilter = event.target.closest("[data-project-menu-filter]");
      if (projectMenuFilter) {
        state.projectMenuFilter = projectMenuFilter.dataset.projectMenuFilter;
        refreshProjectMenuResults();
        return;
      }

      if (teamSwitchMenu.classList.contains("open") && !event.target.closest("#teamSwitchMenu") && !event.target.closest("#teamContextTrigger")) {
        closeScopeMenu(teamSwitchMenu, teamContextTrigger);
      }

      if (topProjectMenu.classList.contains("open") && !event.target.closest("#topProjectMenu") && !event.target.closest("#topProjectSwitcher")) {
        closeScopeMenu(topProjectMenu, topProjectSwitcher);
      }

      if (calendarContextMenu.classList.contains("open") && !event.target.closest("#calendarContextMenu")) {
        closeCalendarContextMenu();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (topProjectMenu.classList.contains("open") && event.target.closest("#topProjectMenu")) {
        const options = [...topProjectMenu.querySelectorAll("[data-project-switch]")];
        const currentIndex = options.indexOf(document.activeElement);
        if (event.key === "ArrowDown" && options.length) {
          event.preventDefault();
          options[currentIndex >= 0 ? (currentIndex + 1) % options.length : 0].focus();
          return;
        }
        if (event.key === "ArrowUp" && options.length) {
          event.preventDefault();
          options[currentIndex >= 0 ? (currentIndex - 1 + options.length) % options.length : options.length - 1].focus();
          return;
        }
        if (event.key === "Enter" && event.target.matches("[data-project-menu-search]") && options.length) {
          event.preventDefault();
          options[0].click();
          return;
        }
      }

      if (event.key === "Escape") {
        closeCalendarContextMenu();
        closeScopeMenu(teamSwitchMenu, teamContextTrigger);
        closeScopeMenu(topProjectMenu, topProjectSwitcher);
        if (event.target.closest("#topProjectMenu")) topProjectSwitcher.focus();
      }
    });

    const sidebar = document.querySelector(".sidebar");

    function closeMobileNav() {
      sidebar.classList.remove("open");
      const toggle = document.getElementById("menuToggle");
      if (toggle) toggle.setAttribute("aria-expanded", "false");
      const backdrop = document.getElementById("sidebarBackdrop");
      if (backdrop) backdrop.classList.remove("open");
    }

    document.querySelectorAll(".nav-item").forEach((item) => {
      item.addEventListener("click", () => {
        if (!state.teamId) return;
        navigateToView(item.dataset.view);
        closeMobileNav();
      });
    });

    const menuToggle = document.getElementById("menuToggle");
    if (menuToggle) {
      menuToggle.addEventListener("click", () => {
        const open = sidebar.classList.toggle("open");
        menuToggle.setAttribute("aria-expanded", String(open));
        document.getElementById("sidebarBackdrop").classList.toggle("open", open);
      });
    }

    teamContextTrigger.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!state.teamId) return;
      toggleScopeMenu(teamSwitchMenu, teamContextTrigger, topProjectMenu, topProjectSwitcher);
    });

    topProjectSwitcher.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!state.teamId || !isProjectView()) return;
      const opening = !topProjectMenu.classList.contains("open");
      if (opening) {
        state.projectMenuQuery = "";
        state.projectMenuFilter = "all";
        renderTopProjectMenu(currentTeam());
      }
      toggleScopeMenu(topProjectMenu, topProjectSwitcher, teamSwitchMenu, teamContextTrigger);
      if (opening) topProjectMenu.querySelector("[data-project-menu-search]")?.focus();
    });

    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener("click", closeMobileNav);
    }

    notificationButton.addEventListener("click", () => {
      if (!state.teamId) return;
      if (isPersonalView()) {
        render();
        const first = workspace.querySelector("[data-signal-jump]");
        if (first) first.focus();
      } else {
        state.view = "dashboard";
        location.hash = "#/" + hashForState();
        render();
      }
    });

    document.getElementById("agentToggle").addEventListener("click", openAgent);
    document.getElementById("agentClose").addEventListener("click", closeAgent);
    document.getElementById("exitGuestButton").addEventListener("click", () => {
      document.body.classList.remove("guest-mode");
    });
    document.getElementById("agentSend").addEventListener("click", () => {
      const input = document.getElementById("agentInput");
      const text = input.value.trim();
      if (!text) return;
      const thread = document.getElementById("agentThread");
      thread.insertAdjacentHTML("beforeend", `<div class="message user">${text}</div>`);
      input.value = "";
      if (/(创建.*链接|发布|邀请|删除|公开|权限)/.test(text)) {
        agentWriteRisk(text);
      } else {
        showToast("演示环境：Agent 调用为 Mock，不会产生副作用");
      }
    });

    document.addEventListener("click", (event) => {
      const promptBtn = event.target.closest("[data-agent-prompt]");
      if (!promptBtn) return;
      document.getElementById("agentInput").value = promptBtn.dataset.agentPrompt;
      if (!state.agentOpen) openAgent();
    });

    stateSelect.addEventListener("change", () => {
      stopStoryboardPlayback();
      stopReviewPlayback();
      state.prototype = stateSelect.value;
      render();
    });

    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) closeModal();
    });

    document.getElementById("modalClose").addEventListener("click", closeModal);
    workspace.addEventListener("scroll", closeCalendarContextMenu, { passive: true });
    window.addEventListener("resize", closeCalendarContextMenu);

    window.addEventListener("hashchange", () => {
      stopStoryboardPlayback();
      stopReviewPlayback();
      restoreStateFromHash();
      render();
    });

    function scrollGanttToToday() {
      const today = workspace.querySelector("[data-gantt-today]");
      const scroller = workspace.querySelector(".gantt-scroll");
      if (today && scroller) {
        scroller.scrollLeft = Math.max(0, today.offsetLeft - 96);
      }
    }

    function scrollCalendarToSelected() {
      const selected = workspace.querySelector(".calendar-day.selected");
      const scroller = workspace.querySelector(".month-calendar-scroll");
      if (!selected || !scroller || scroller.scrollWidth <= scroller.clientWidth) return;
      const selectedRect = selected.getBoundingClientRect();
      const scrollerRect = scroller.getBoundingClientRect();
      const target = scroller.scrollLeft + selectedRect.left - scrollerRect.left - (scroller.clientWidth - selectedRect.width) / 2;
      scroller.scrollLeft = Math.max(0, target);
    }

    function init() {
      restoreStateFromHash();
      updateNotificationButton();
      render();
      requestAnimationFrame(scrollGanttToToday);
    }

    init();
  </script>
</body>
</html>
