<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ShadowProducer Low Fidelity</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #eef0f3;
      --panel-3: #e6e9ed;
      --line: #e3e6ea;
      --line-strong: #c8cdd5;
      --text: #17191d;
      --muted: #5b616a;
      --quiet: #8a9098;
      --accent: #002fa7;
      --accent-strong: #00217c;
      --accent-hover: #1a3fc4;
      --accent-soft: #edf0fb;
      --accent-ink: #ffffff;
      --warn: #b45309;
      --danger: #dc2626;
      --info: #2563eb;
      --success: #15803d;
      --sidebar: 232px;
      --topbar: 68px;
      --agent: 372px;
      --radius: 0px;
      --shadow-sm: 0 1px 2px rgba(15, 18, 22, 0.05);
      --shadow-md: 0 12px 32px rgba(15, 18, 22, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button,
    select,
    input,
    textarea {
      border-radius: var(--radius);
    }

    button {
      color: var(--text);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .app {
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      grid-template-rows: var(--topbar) minmax(0, 1fr);
      background: var(--bg);
    }

    .app.agent-open {
      grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--agent);
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr) auto;
      min-width: 0;
      height: var(--topbar);
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-right: 1px solid var(--line);
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      width: 27px;
      height: 27px;
      border: 1px solid var(--text);
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 800;
    }

    .top-context {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 8px 12px;
      overflow: hidden;
    }

    .context-bar {
      min-width: 0;
      width: min(252px, 27vw);
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      overflow: hidden;
      flex: 0 1 252px;
    }

    .context-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--accent);
    }

    .context-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .context-copy strong,
    .context-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-copy strong {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .context-copy span {
      margin-top: 2px;
      color: var(--quiet);
      font-size: 10px;
    }

    .top-project-switcher {
      display: none;
      min-width: 0;
      width: min(252px, 27vw);
      height: 44px;
      align-items: center;
      gap: 10px;
      flex: 0 1 252px;
      margin-left: -1px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }

    .top-project-switcher.is-visible {
      display: flex;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px 10px 8px;
    }

    .icon-button,
    .button,
    .ghost-button,
    .danger-button {
      min-height: 36px;
      border: 1px solid var(--line);
      background: #ffffff;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
    }

    .icon-button {
      min-width: 38px;
      padding: 0 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .button,
    .ghost-button,
    .danger-button {
      padding: 0 12px;
    }

    .button {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
    }

    .ghost-button {
      background: transparent;
    }

    .danger-button {
      color: #ffffff;
      background: var(--danger);
      border-color: var(--danger);
      font-weight: 700;
    }

    .icon-button:hover,
    .ghost-button:hover {
      background: var(--panel-3);
      border-color: var(--line-strong);
    }

    .button:hover {
      background: #1a3fc4;
      border-color: #1a3fc4;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .top-search {
      width: clamp(190px, 18vw, 280px);
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--line);
      background: #f2f4f7;
      color: var(--quiet);
    }

    .top-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .top-search input::placeholder {
      color: var(--quiet);
    }

    .top-search:focus-within {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .notification-button {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }

    .notification-button:hover {
      border-color: var(--line);
    }

    .notification-button {
      position: relative;
    }

    .notification-button.has-items::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 5px;
      height: 5px;
      background: var(--danger);
      box-shadow: 0 0 0 2px #ffffff;
    }

    .agent-trigger {
      min-width: 42px;
      border-color: #002fa7;
      background: #edf0fb;
      color: #002fa7;
    }

    .agent-trigger:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .sidebar {
      grid-column: 1;
      grid-row: 2;
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #ffffff;
      padding: 14px 0 18px;
    }

    .menu-button {
      display: none;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      cursor: pointer;
    }

    .menu-button:hover {
      color: var(--text);
      border-color: var(--line-strong);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(15, 18, 22, 0.4);
    }

    .sidebar-backdrop.open {
      display: block;
    }

    .nav-section {
      margin-bottom: 18px;
    }

    .nav-label {
      margin: 0;
      padding: 8px 17px 6px;
      color: var(--quiet);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-left: 4px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 0 17px 0 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-main span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-item:hover {
      color: var(--text);
      background: #f0f2f5;
    }

    .nav-item.active {
      color: var(--text);
      background: #edf0fb;
      border-left-color: var(--accent);
    }

    .nav-item.active .icon {
      color: #002fa7;
    }

    .nav-item.active .nav-count {
      color: #00217c;
      background: #dce5f8;
    }

    .nav-count {
      min-width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border: 0;
      color: var(--muted);
      font-size: 11px;
      background: #f7f8fa;
    }

    .prototype-controls {
      margin: 22px 16px 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .prototype-controls label {
      display: block;
      margin-bottom: 7px;
      color: var(--quiet);
      font-size: 11px;
      font-weight: 700;
    }

    .prototype-controls select {
      width: 100%;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 8px;
    }

    .workspace {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: #f5f6f8;
      scrollbar-color: #c8cdd5 #ffffff;
      scrollbar-width: thin;
    }

    .workspace::-webkit-scrollbar,
    .agent-thread::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .workspace::-webkit-scrollbar-track,
    .agent-thread::-webkit-scrollbar-track {
      background: #ffffff;
    }

    .workspace::-webkit-scrollbar-thumb,
    .agent-thread::-webkit-scrollbar-thumb {
      border: 2px solid #ffffff;
      background: #c8cdd5;
    }

    .agent-open .workspace {
      grid-column: 2;
    }

    .page {
      min-height: 100%;
      padding: 26px 24px 48px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-heading {
      min-width: 0;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 7px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 26px;
      line-height: 1.22;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.35;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 13px;
    }

    .page-subtitle,
    .muted {
      color: var(--muted);
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .scope-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip,
    .status,
    .owner-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .chip.accent,
    .status.ok {
      border-color: #b6dcc8;
      color: var(--success);
    }

    .status.warn {
      border-color: #e6cf9e;
      color: var(--warn);
    }

    .status.danger {
      border-color: #ecc2c2;
      color: var(--danger);
    }

    .status.info {
      border-color: #bcd0f5;
      color: var(--info);
    }

    .notice {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--warn);
      background: #fbf6ec;
      margin-bottom: 16px;
    }

    .notice.partial {
      border-left-color: var(--info);
      background: #f0f4fb;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      position: relative;
      min-width: 0;
      min-height: 118px;
      padding: 17px 58px 15px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      margin-top: 14px;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-note {
      color: var(--quiet);
      font-size: 11px;
      margin-top: 8px;
    }

    .stat-icon {
      position: absolute;
      right: 16px;
      bottom: 18px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--accent);
    }

    .stat-icon .icon {
      width: 30px;
      height: 30px;
      stroke-width: 1.35;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.72fr);
      gap: 16px;
      align-items: start;
    }

    .team-overview {
      display: grid;
      gap: 20px;
    }

    .team-feature {
      min-width: 0;
    }

    .team-feature-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .team-feature-head h2 {
      margin: 0;
    }

    .team-feature-count {
      color: var(--quiet);
      font-size: 11px;
      white-space: nowrap;
    }

    .team-project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }

    .project-browser-card {
      appearance: none;
      width: 100%;
      min-width: 0;
      display: block;
      padding: 0;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .project-browser-card:hover,
    .project-browser-card:focus-visible {
      border-color: var(--accent);
      outline: 0;
    }

    .project-card-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--panel-2);
    }

    .project-card-thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-card-label {
      min-width: 0;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border-top: 1px solid var(--line);
    }

    .project-card-label strong {
      overflow: hidden;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-card-label .icon {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      color: var(--accent);
    }

    .team-activity-icon,
    .team-member-avatar {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--accent);
    }

    .team-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(290px, 0.72fr);
      gap: 16px;
      align-items: start;
    }

    .team-feature-panel {
      min-width: 0;
      border: 1px solid var(--line);
      background: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .team-feature-panel > .team-feature-head {
      min-height: 52px;
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .team-activity-row {
      appearance: none;
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .team-activity-row:last-child {
      border-bottom: 0;
    }

    .team-activity-row:hover,
    .team-activity-row:focus-visible {
      background: var(--panel-2);
      outline: 0;
    }

    .team-activity-icon {
      width: 34px;
      height: 34px;
    }

    .team-activity-icon .icon {
      width: 16px;
      height: 16px;
    }

    .team-activity-copy {
      min-width: 0;
    }

    .team-activity-title {
      display: block;
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-activity-source,
    .team-activity-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 7px;
      margin-top: 5px;
      color: var(--quiet);
      font-size: 11px;
    }

    .team-activity-source strong {
      color: var(--muted);
      font-weight: 600;
    }

    .team-activity-row > .icon {
      width: 15px;
      height: 15px;
      color: var(--quiet);
    }

    .team-member-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      min-height: 58px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }

    .team-member-row:last-child {
      border-bottom: 0;
    }

    .team-member-avatar {
      width: 34px;
      height: 34px;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
    }

    .team-member-copy {
      min-width: 0;
    }

    .team-member-name {
      display: flex;
      align-items: baseline;
      gap: 7px;
      overflow: hidden;
      white-space: nowrap;
    }

    .team-member-name strong {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-member-name span {
      color: var(--quiet);
      font-size: 11px;
    }

    .team-member-scope {
      margin-top: 4px;
      overflow: hidden;
      color: var(--quiet);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-tracking-shell {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.75fr);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow-sm);
    }

    .project-tracking-panel {
      min-width: 0;
      background: var(--panel);
    }

    .project-tracking-panel + .project-tracking-panel {
      border-left: 1px solid var(--line);
    }

    .project-tracking-head {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .project-tracking-head h2,
    .project-milestone-head h3 {
      margin: 0;
    }

    .project-tracking-head h2 {
      font-size: 15px;
    }

    .project-tracking-meta {
      color: var(--quiet);
      font-size: 10px;
      white-space: nowrap;
    }

    .project-progress-summary {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
    }

    .project-progress-value strong,
    .project-progress-value span {
      display: block;
    }

    .project-progress-value strong {
      font-size: 31px;
      line-height: 1;
    }

    .project-progress-value span {
      margin-top: 7px;
      color: var(--quiet);
      font-size: 10px;
    }

    .project-progress-copy {
      min-width: 0;
    }

    .project-progress-copy strong {
      display: block;
      font-size: 13px;
    }

    .project-progress-copy p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .project-progress-bar {
      height: 7px;
      margin-top: 11px;
      overflow: hidden;
      background: var(--panel-3);
    }

    .project-progress-bar span {
      display: block;
      width: var(--project-progress);
      height: 100%;
      background: var(--accent);
    }

    .project-stage-scroll {
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    .project-stage-track {
      min-width: 620px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 18px 16px 20px;
    }

    .project-stage-step small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

    .project-stage-step strong {
      margin-top: 10px;
      font-size: 11px;

    .project-stage-step small {

      color: var(--quiet);

    .project-stage-step.active strong {

      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;

    .project-milestone-row:last-child {
      border-bottom: 0;

    .project-milestone-row:hover,

      background: var(--panel-2);
      outline: 0;
    }

    .project-milestone-marker {
      width: 9px;
      height: 9px;
      border: 2px solid var(--line-strong);
      background: var(--panel);
    }

    .project-milestone-marker.done {
      border-color: var(--success);
      background: var(--success);
    }

    .project-milestone-marker.active {
      border-color: var(--accent);
      background: var(--accent);
    }

    .project-milestone-copy {
      min-width: 0;
    }

    .project-milestone-copy strong,
    .project-milestone-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-milestone-copy strong {
      font-size: 12px;
    }

    .project-milestone-copy span,
    .project-milestone-date {
      margin-top: 4px;
      color: var(--quiet);
      font-size: 10px;
    }

    .project-milestone-date {

      white-space: nowrap;

    .project-milestone-state {

      text-align: right;
      white-space: nowrap;

      height: 15px;

    .project-activity-empty {
      padding: 22px 14px;

    .section {

      border: 1px solid var(--line);

      margin-bottom: 22px;
      background: #ffffff;

      grid-template-columns: 128px repeat(7, minmax(93px, 1fr));
      grid-template-rows: 46px repeat(3, 92px);

    .gantt-corner,

    .gantt-lane-label span {

      background: #eaf0fb;

      text-overflow: ellipsis;
      white-space: nowrap;

      line-height: 1.15;

    .gantt-task-meta {

      gap: 12px;
      color: var(--quiet);
      font-size: 10px;
    }

    .gantt-summary span {

      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

      height: 7px;
      display: inline-block;
      background: currentColor;

    .gantt-summary .personal {
      color: #64748b;
    }

    .gantt-summary .team {
      color: var(--success);
    }

    .gantt-summary .project {
      color: var(--info);
    }

    .list {
      border: 1px solid var(--line);

      background:

    .shoot-thumb::after {

    .script-paper-scroll {

    .script-paper-meta {

    .script-editor:focus {

    }

    .script-side-panel {

    }

    .collaboration-section {

    }

    .collaboration-heading {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #f7f8fa;
      font-size: 11px;
      font-weight: 700;
    }

    .presence-row,
    .script-comment,
    .source-row {
      min-height: 54px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
    }

    .presence-row {

      align-items: center;
      gap: 8px;
    }

    .presence-row:last-child,
    .script-comment:last-child,
    .source-row:last-child {
      border-bottom: 0;
    }

    .presence-dot {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--panel-3);
      font-size: 10px;
      font-weight: 700;
    }

    .presence-row strong,
    .presence-row span,
    .script-comment strong,
    .script-comment span,
    .source-row strong,
    .source-row span {
      display: block;
    }

    .presence-row span,
    .script-comment span,
    .source-row span {
      margin-top: 3px;
      color: var(--quiet);
      font-size: 10px;
      line-height: 1.45;
    }

    .presence-status {
      color: var(--success);
      font-size: 9px;
    }

    .script-comment {
      width: 100%;
      border-top: 0;
      border-right: 0;
      border-left: 3px solid transparent;
      background: #ffffff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .script-comment:hover {
      border-left-color: var(--accent);
      background: var(--accent-soft);
    }

    .storyboard-workspace {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .storyboard-toolbar {
      flex-wrap: wrap;
    }

    .storyboard-toolbar-copy strong,
    .storyboard-toolbar-copy span {
      display: block;
    }

    .storyboard-toolbar-copy span {
      margin-top: 3px;
      color: var(--quiet);
      font-size: 10px;
    }

    .storyboard-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 286px;
    }

    .storyboard-main {
      min-width: 0;
      overflow: auto;
      background: var(--panel-2);
    }

    .storyboard-inspector {
      border-left: 1px solid var(--line);
      overflow: auto;
    }

    .storyboard-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(210px, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .storyboard-card {
      min-width: 0;
      padding: 0;
      border: 0;
      background: #ffffff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .storyboard-card:hover,
    .storyboard-card.active {
      box-shadow: inset 0 -3px 0 var(--accent);
    }

    .storyboard-card.active .shot-number {
      color: var(--accent);
    }

    .shot-thumbnail {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, var(--panel-3) 0 48%, var(--line-strong) 48% 52%, var(--panel-2) 52%);
    }

    .shot-thumbnail::before,
    .shot-thumbnail::after {
      content: "";
      position: absolute;
      border: 1px solid var(--muted);
      opacity: 0.62;
    }

    .shot-thumbnail::before {
      width: 28%;
      height: 44%;
      left: var(--subject-x, 46%);
      bottom: 12%;
      transform: translateX(-50%);
    }

    .shot-thumbnail::after {
      width: 46%;
      height: 1px;
      left: 10%;
      bottom: 28%;
      border-width: 1px 0 0;
    }

    .shot-thumbnail.close::before {
      width: 44%;
      height: 64%;
    }

    .shot-thumbnail.detail::before {
      width: 62%;
      height: 24%;
      left: 50%;
      bottom: 20%;
    }

    .shot-thumbnail.tracking::after {
      width: 76%;
      bottom: 18%;
      transform: rotate(-7deg);
      transform-origin: left center;
    }

    .shot-thumbnail-code {
      position: absolute;
      top: 7px;
      left: 7px;
      padding: 3px 5px;
      background: #ffffff;
      color: var(--text);
      font-size: 9px;
      font-weight: 700;
    }

    .storyboard-card-body {
      min-height: 132px;
      display: block;
      padding: 11px;
    }

    .shot-card-head,
    .shot-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shot-number {
      font-size: 13px;
      font-weight: 800;
    }

    .shot-card-copy {
      min-height: 48px;
      display: block;
      margin: 9px 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .shot-card-meta {
      color: var(--quiet);
      font-size: 10px;
    }

    .storyboard-table {
      min-width: 920px;
      border: 0;
    }

    .storyboard-table tr[data-storyboard-shot] {
      cursor: pointer;
    }

    .storyboard-table tr[data-storyboard-shot]:hover td,
    .storyboard-table tr.active td {
      background: var(--accent-soft);
    }

    .storyboard-table-thumb {
      width: 112px;
    }

    .storyboard-table-thumb .shot-thumbnail {
      width: 96px;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--line);
    }

    .animatic-shell {

      background: #ffffff;
    }

    .animatic-preview-area {
      padding: 18px;
      background: var(--text);

    .animatic-canvas {

      width: min(860px, 100%);

      overflow: hidden;
      border: 1px solid var(--line-strong);
      background: var(--panel-3);

    .animatic-frame-visual,
    .animatic-frame-visual .shot-thumbnail {

      width: 100%;
      height: 100%;

    .animatic-frame-visual .shot-thumbnail {

    .animatic-frame-meta {

      color: var(--text);

    }

    .animatic-frame-meta span {

    .animatic-frame-copy {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 11px 14px;
      background: var(--text);
      color: #ffffff;
      font-size: 11px;
      line-height: 1.5;

    .animatic-frame-copy strong,
    .animatic-frame-copy span {
      display: block;
    }

    .animatic-frame-copy span {
      margin-top: 4px;
      color: var(--line-strong);
    }

    .animatic-dialogue {

      font-size: 16px;

      line-height: 1.45;
      text-align: center;

    .animatic-control .icon {

    .animatic-timecode {

    .animatic-scrubber {

    .animatic-transport-note {
      color: var(--quiet);
      font-size: 10px;
      white-space: nowrap;
    }

    .animatic-timeline-scroll {
      overflow-x: auto;
      background: #ffffff;

    .animatic-timeline {

      color: var(--quiet);

    }

    .animatic-ruler {

    .animatic-clip {

    .animatic-playhead {

    .animatic-playhead::before {
      content: "";

      height: 8px;

    .storyboard-duration-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24px;
      align-items: center;
      gap: 6px;

    .storyboard-duration-editor input {

    .execution-plan-head,
    .call-sheet-index-head,
    .call-sheet-document-toolbar {

      align-items: center;
      justify-content: space-between;

      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      background: #f7f8fa;

    .execution-plan-head p,

      font-weight: 700;

      white-space: nowrap;

    .call-sheet-section {
      border-bottom: 1px solid var(--line-strong);
    }

    .call-sheet-section-title {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      background: #f1f3f5;
    }

    .call-sheet-section-title strong {
      font-size: 11px;
      text-transform: uppercase;
    }

    .call-sheet-document .table-wrap {
      border: 0;
    }

    .call-sheet-document table {
      min-width: 100%;
      font-size: 11px;
    }

    .call-sheet-document th,
    .call-sheet-document td {
      padding: 8px 9px;
    }

    .call-sheet-notes-grid,
    .call-sheet-contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .call-sheet-note,
    .call-sheet-contact {
      min-width: 0;
      padding: 11px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .call-sheet-note:nth-child(2n),
    .call-sheet-contact:nth-child(2n) {
      border-right: 0;
    }

    .call-sheet-note strong,
    .call-sheet-contact strong {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .call-sheet-note span,
    .call-sheet-contact span {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .call-sheet-warning {
      color: var(--danger);
    }

    .call-sheet-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      color: var(--muted);
      font-size: 10px;
    }

    @media (max-width: 900px) {
      .execution-overview {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .execution-overview-main {
        grid-column: 1 / -1;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .call-sheet-workspace {
        grid-template-columns: 1fr;
      }

      .call-sheet-index {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .call-sheet-index-list {
        grid-auto-flow: column;
        grid-auto-columns: minmax(210px, 1fr);
        overflow-x: auto;
      }

      .call-sheet-day {
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }
    }

    @media (max-width: 620px) {
      .execution-overview {
        grid-template-columns: 1fr;
      }

      .execution-metric {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .execution-metric:last-child {
        border-bottom: 0;
      }

      .call-sheet-scroll {
        padding: 10px;
      }
    }

    .review-browser-shell {
      min-height: 560px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .review-folder-pane {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: var(--panel-2);
    }

    .review-folder-head,
    .review-browser-toolbar,
    .review-comments-head {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }

    .review-folder-head strong,
    .review-comments-head strong {
      font-size: 13px;
    }

    .review-folder-list {
      padding: 6px 0;
    }

    .review-folder-button {
      width: 100%;
      min-height: 38px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 0;
      border-left: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 0 10px 0 12px;
      text-align: left;
      cursor: pointer;
    }

    .review-folder-button:hover,
    .review-folder-button.active {
      color: var(--text);
      background: var(--panel);
      border-left-color: var(--accent);
    }

    .review-folder-button .icon {
      width: 15px;
      height: 15px;
    }

    .review-folder-count {
      color: var(--quiet);
      font-size: 11px;
    }

    .review-browser-main {
      min-width: 0;
    }

    .review-browser-toolbar {
      flex-wrap: wrap;
      background: #ffffff;
    }

    .review-breadcrumb {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .review-breadcrumb button {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      cursor: pointer;
    }

    .review-breadcrumb button:hover {
      color: var(--accent);
    }

    .review-browser-tools {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .review-browser-search {
      width: min(260px, 34vw);
      height: 32px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 9px;
    }

    .review-file-head,
    .review-file-row {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 100px 110px 150px 92px;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
    }

    .review-file-head {
      min-height: 34px;
      border-bottom: 1px solid var(--line);
      color: var(--quiet);
      background: var(--panel-2);
      font-size: 11px;
    }

    .review-file-row {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .review-file-row:hover,
    .review-file-row:focus-visible {
      background: var(--panel-2);
      outline: none;
    }

    .review-file-primary {
      min-width: 0;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .review-file-icon {
      width: 42px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-3);
    }

    .review-file-icon.video {
      background:
        linear-gradient(145deg, #292d30 0 48%, #17191b 48% 61%, #32373b 61%),
        var(--panel-3);
      color: #ffffff;
    }

    .review-file-name {
      min-width: 0;
    }

    .review-file-name strong,
    .review-file-name span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-file-name span,
    .review-file-cell {
      color: var(--muted);
      font-size: 11px;
    }

    .review-workspace {
      min-height: 610px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .review-player-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #050607;
    }

    .review-context-bar {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .review-context-copy {
      min-width: 0;
    }

    .review-context-copy strong,
    .review-context-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-context-copy span {
      color: var(--muted);
      font-size: 11px;
    }

    .review-version-select {
      height: 30px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 26px 0 8px;
    }

    .player-shell {
      border: 1px solid var(--line);
      background: #050607;
    }

    .review-player-column .player-shell {
      border: 0;
      flex: 1;
    }

    .players {
      display: grid;
      grid-template-columns: 1fr;
    }

    .players.compare {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mock-video {
      position: relative;
      aspect-ratio: 16 / 9;
      min-width: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(150deg, #272b2e 0 42%, #17191b 42% 60%, #303437 60%),
        #111;
    }

    .mock-video:last-child {
      border-right: 0;
    }

    .mock-video::before {
      content: "";
      position: absolute;
      width: 34%;
      height: 52%;
      left: 15%;
      bottom: 0;
      border: 1px solid #8b9298;
      background: #222629;
    }

    .mock-video::after {
      content: "";
      position: absolute;
      width: 19%;
      height: 28%;
      right: 12%;
      top: 20%;
      border: 1px solid #737a80;
      background: #17191b;
    }

    .video-label {
      position: relative;
      z-index: 2;
      padding: 7px 9px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: rgba(0, 0, 0, 0.68);
      font-size: 12px;
    }

    .player-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .timeline {
      height: 8px;
      background: var(--panel-3);
      position: relative;
    }

    .timeline::before {
      content: "";
      position: absolute;
      inset: 0 37% 0 0;
      background: var(--accent);
    }

    .review-bottom-dock {
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .review-playback-row {
      min-height: 46px;
      display: grid;
      grid-template-columns: auto auto auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
    }

    .review-playback-row .mini-action {
      width: 32px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .review-scrubber {
      width: 100%;
      accent-color: var(--accent);
    }

    .review-time-readout {
      min-width: 126px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 12px;
    }

    .review-annotation {
      padding: 9px 10px 10px;
    }

    .review-annotation-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .review-annotation-tool {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 8px;
      cursor: pointer;
    }

    .review-annotation-tool.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .review-note-compose {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) auto;
      gap: 7px;
    }

    .review-note-compose input {
      min-width: 0;
      height: 34px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 8px;
    }

    .review-comments-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .review-comment-filters {
      display: flex;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .review-comment-filter {
      min-height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .review-comment-filter.active {
      color: var(--text);
      background: var(--panel-2);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .review-comment-list {
      min-height: 0;
      overflow-y: auto;
    }

    .review-comment {
      width: 100%;
      display: block;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }

    .review-comment:hover {
      background: var(--panel-2);
    }

    .review-comment.resolved {
      opacity: 0.66;
    }

    .review-comment p {
      margin: 0 0 8px;
      line-height: 1.5;
    }

    .review-comment-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--quiet);
      font-size: 11px;
    }

    .review-comments-empty {
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
    }

    .comments {
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .comment {
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .comment-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .comment-input {
      padding: 10px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 7px;
    }

    .comment-input input {
      min-width: 0;
      height: 34px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 8px;
    }

    .asset-grid,
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .asset,
    .work {
      min-width: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .asset-thumb,
    .work-thumb {
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background:
        linear-gradient(135deg, #292d30 0 46%, #1a1d20 46% 57%, #32373b 57%),
        var(--panel-3);
    }

    .asset-body,
    .work-body {
      padding: 10px;
    }

    .progress {
      height: 6px;
      background: var(--bg);
      margin-top: 8px;
    }

    .progress > span {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    .contact-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) 320px;
      gap: 16px;
    }

    .contact-layout > * {
      min-width: 0;
    }

    .contact-source-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      min-height: 62px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--source-color);
      background: #ffffff;
      margin-bottom: 12px;
    }

    .contact-source-bar strong {
      display: block;
      margin-bottom: 4px;
    }

    .contact-source-count {
      color: var(--source-color);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .contact-toolbar {
      min-width: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #f7f8fa;
    }

    .contact-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .contact-filter label {
      color: var(--quiet);
      font-size: 11px;
      white-space: nowrap;
    }

    .contact-filter select {
      height: 30px;
      min-width: 156px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      padding: 0 28px 0 8px;
    }

    .contact-result-count {
      color: var(--quiet);
      font-size: 11px;
      white-space: nowrap;
    }

    .contact-row {
      cursor: pointer;
      transition: background 160ms ease;
    }

    .contact-row:hover {
      background: #f0f2f5;
    }

    .contact-row.active {
      background: #eaf0fb;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .contact-empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      text-align: center;
    }

    .contact-detail {
      border: 1px solid var(--line);
      background: #ffffff;
      padding: 14px;
      position: sticky;
      top: 0;
    }

    .contact-detail-rule {
      margin: 12px 0;
      padding: 9px 10px;
      border-left: 2px solid var(--source-color);
      background: #f7f8fa;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .contact-detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .masked {
      color: var(--quiet);
      letter-spacing: 2px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
      overflow-x: auto;
    }

    .tab {
      min-height: 36px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .empty-state,
    .system-state {
      min-height: 360px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px dashed var(--line-strong);
      background: #ffffff;
      padding: 30px;
    }

    .system-state .state-code {
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .system-state h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .skeleton {
      width: min(520px, 90%);
    }

    .skeleton span {
      display: block;
      height: 12px;
      background: #e6e9ed;
      margin-bottom: 10px;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    .skeleton span:nth-child(2) {
      width: 76%;
    }

    .skeleton span:nth-child(3) {
      width: 48%;
    }

    @keyframes pulse {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    .agent-drawer {
      grid-column: 3;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: none;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border-left: 1px solid var(--line-strong);
      background: #ffffff;
    }

    .agent-open .agent-drawer {
      display: grid;
    }

    .agent-head {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      box-shadow: inset 0 2px 0 var(--accent);
    }

    .agent-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .agent-identity {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 10px;
      margin-top: 11px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-left: 2px solid var(--accent);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 11px;
    }

    .agent-identity strong {
      color: var(--text);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-thread {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .message {
      max-width: 92%;
      margin-bottom: 12px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: #ffffff;
      line-height: 1.55;
    }

    .message.user {
      margin-left: auto;
      border-color: #bcd0f5;
      background: #eaf0fb;
    }

    .agent-plan {
      margin-bottom: 12px;
      border: 1px solid #e6cf9e;
      background: #fbf6ec;
    }

    .agent-plan-head {
      padding: 8px 10px;
      border-bottom: 1px solid #e6cf9e;
      color: var(--warn);
      font-size: 11px;
      font-weight: 700;
    }

    .agent-plan-body {
      padding: 10px;
      line-height: 1.5;
    }

    .agent-plan-actions {
      display: flex;
      gap: 7px;
      padding: 0 10px 10px;
    }

    .agent-compose {
      border-top: 1px solid var(--line);
      padding: 10px;
      background: #ffffff;
    }

    .quick-prompts {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 8px;
    }

    .quick-prompts button {
      flex: 0 0 auto;
      min-height: 26px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 7px;
      cursor: pointer;
    }

    .compose-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
    }

    .compose-row textarea {
      width: 100%;
      min-height: 54px;
      max-height: 140px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 8px;
      resize: vertical;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 18, 22, 0.46);
      z-index: 60;

    .modal {
      width: min(560px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      border: 1px solid var(--line-strong);
      background: #ffffff;

      margin: 0;

    .modal-body {
      padding: 14px;
    }

    .modal-foot {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;

    .check-list {
      display: grid;
      gap: 8px;
    }

    .check-row {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .risk-summary {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      margin-top: 12px;
    }

    .risk-summary div {
      min-height: 38px;
      padding: 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .risk-summary div:nth-child(odd) {
      color: var(--muted);
      background: var(--panel-3);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      min-width: 260px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 11px 12px;
      border: 1px solid var(--line-strong);
      border-left: 3px solid var(--accent);
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(15, 18, 22, 0.22), 0 2px 8px rgba(15, 18, 22, 0.08);
      color: var(--text);
      transform: translateY(24px);
      opacity: 0;
      pointer-events: none;
      transition: 160ms ease;
      z-index: 90;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .guest-app {
      min-height: 100vh;
      display: none;
      background: #f5f6f8;
    }

    body.guest-mode .app {
      display: none;
    }

    body.guest-mode .guest-app {
      display: block;
    }

    .guest-topbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .guest-content {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .guest-review {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
    }

    .dashboard-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .dashboard-signals {
      margin-bottom: 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .dashboard-signal {
      --signal-color: var(--info);
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      min-width: 0;
      border-bottom: 1px solid var(--line);
    }

    .dashboard-signal:last-child {
      border-bottom: 0;
    }

    .dashboard-signal::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--signal-color);
    }

    .dashboard-signal.danger {
      --signal-color: var(--danger);
    }

    .dashboard-signal.warn {
      --signal-color: var(--warn);
    }

    .dashboard-signal.info {
      --signal-color: var(--info);
    }

    .dashboard-signal-main {
      width: 100%;
      min-width: 0;
      min-height: 68px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 9px 14px 9px 16px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .dashboard-signal-main:hover,
    .dashboard-signal-main:focus-visible {
      background: var(--panel-2);
    }

    .dashboard-signal-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--signal-color) 55%, var(--line));
      color: var(--signal-color);
      background: color-mix(in srgb, var(--signal-color) 8%, transparent);
    }

    .dashboard-signal-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .dashboard-signal-kicker {
      color: var(--signal-color);
      font-size: 10px;
      font-weight: 700;
    }

    .dashboard-signal-title {
      font-size: 13px;
      line-height: 1.35;
    }

    .dashboard-signal-meta {
      color: var(--quiet);
      font-size: 11px;
      line-height: 1.4;
    }

    .dashboard-signal-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .dashboard-signal-action .icon {
      width: 15px;
      height: 15px;
    }

    .dashboard-signal-dismiss {
      width: 44px;
      min-height: 44px;
      align-self: stretch;
      display: grid;
      place-items: center;
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      color: var(--quiet);
      cursor: pointer;
    }

    .dashboard-signal-dismiss:hover,
    .dashboard-signal-dismiss:focus-visible {
      color: var(--text);
      background: var(--panel-2);
    }

    .dashboard-signal-dismiss .icon {
      width: 15px;
      height: 15px;
    }

    .dashboard-board {
      min-width: 0;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .dashboard-board-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #f7f8fa;

    .dashboard-board-heading {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .dashboard-board-mark {
      width: 3px;
      height: 30px;
      flex: 0 0 auto;
      background: var(--accent);

    .dashboard-board-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .dashboard-board-copy strong {
      font-size: 14px;
      line-height: 1.25;
    }

    .dashboard-board-copy span {
      color: var(--quiet);
      font-size: 10px;
      line-height: 1.35;
    }

    .dashboard-board-body {
      min-width: 0;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .dashboard-calendar {
      min-width: 0;
      padding: 14px;
      border-right: 1px solid var(--line);
      background: #ffffff;
    }

    .dashboard-timeline {
      min-width: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .dashboard-timeline .board-filter-bar {
      margin-bottom: 0;

      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .dashboard-timeline .gantt-scroll {
      border: 0;
    }

    .mini-calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mini-calendar-title {
      font-size: 14px;
      font-weight: 700;
    }

    .mini-calendar-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .calendar-arrow {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      cursor: pointer;
    }

    .calendar-arrow:hover {
      color: var(--text);
      border-color: var(--line-strong);
    }

    .mini-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
      text-align: center;
    }

    .mini-calendar-grid span {
      min-width: 0;
      height: 27px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;

    .mini-calendar-grid .week-label,

      color: var(--quiet);

    .mini-calendar-grid .selected {
      color: #fff;

      font-weight: 700;
    }

    .mini-calendar-grid .marked {
      position: relative;

    }

    .mini-calendar-grid .marked::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 3px;
      height: 3px;
      background: var(--accent);
      transform: translateX(-50%);

    .dashboard-recent {
      margin-bottom: 0;
    }

        padding: 9px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .notes-filter-label {
        display: none;
      }

      .notes-filter-list {
        display: flex;
        gap: 5px;
        overflow-x: auto;
      }

      .notes-filter-button {
        width: auto;
        min-width: max-content;
      }

      .notes-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .notes-results-summary {
        align-self: flex-end;
      }

      .notes-page-list {
        grid-template-columns: 1fr;
      }

      .month-calendar {
        min-width: 658px;
      }

      .calendar-day {
        min-height: 94px;
      }

      .team-selection-card {
        min-height: 168px;
      }

      .team-selection-mark {
        margin-bottom: 18px;
      }

      .board-columns {
        grid-template-columns: repeat(4, minmax(168px, 1fr));
      }

      .board-column {
        min-height: 280px;
      }
    }

    @media (max-width: 1280px) {
      .script-workspace {
        grid-template-columns: 196px minmax(380px, 1fr);
      }

      .script-side-panel {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .collaboration-section {
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      .collaboration-section:last-child {
        border-right: 0;
      }

      .storyboard-card-grid {
        grid-template-columns: repeat(2, minmax(210px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .breakdown-workspace {
        grid-template-columns: 1fr;
      }

      .breakdown-category-rail {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .breakdown-category-summary {
        display: none;
      }

      .breakdown-category-list {
        display: flex;
        overflow-x: auto;
      }

      .breakdown-category-button {
        min-width: 168px;
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      .breakdown-category-button.active {
        box-shadow: inset 0 -3px 0 var(--accent);
      }

      .script-workspace,
      .storyboard-body {
        grid-template-columns: 1fr;
      }

      .script-document-rail,
      .storyboard-inspector {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .script-document-rail {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) repeat(3, minmax(140px, 0.7fr));
        overflow-x: auto;
      }

      .script-document-summary,
      .script-version-item {
        min-width: 150px;
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      .script-side-panel {
        grid-column: auto;
      }

      .storyboard-inspector {
        grid-row: 1;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        border-left: 0;
      }

      .storyboard-main {
        grid-row: 2;
      }

      .shot-detail-preview {
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      .storyboard-inspector .detail-stack {
        display: grid;
        grid-template-columns: repeat(3, minmax(130px, 1fr));
        overflow-x: auto;
      }
    }

    @media (max-width: 620px) {
      .scripts-tabs .tab {
        min-width: 50%;
        flex: 1;
      }

      .script-editor-toolbar,
      .storyboard-toolbar {
        align-items: flex-start;
      }

      .script-editor-toolbar {
        flex-direction: column;
      }

      .editor-presence {
        width: 100%;
        justify-content: space-between;
      }

      .script-paper-scroll {
        padding: 10px;
      }

      .script-paper {
        min-height: 620px;
        padding: 32px 24px 48px;
      }

      .script-side-panel {
        display: block;
      }

      .collaboration-section {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .storyboard-view-switch {
        width: 100%;
      }

      .view-switch-button {
        min-width: 0;
        flex: 1;
      }

      .storyboard-card-grid {
        grid-template-columns: 1fr;
      }

      .breakdown-category-header {
        align-items: stretch;
        flex-direction: column;
      }

      .breakdown-category-actions {
        justify-content: space-between;
      }

      .storyboard-inspector {
        display: block;
      }

      .shot-detail-preview {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .animatic-preview-area {
        padding: 10px;
      }

      .animatic-transport {
        grid-template-columns: auto 1fr;
      }

      .animatic-timecode {
        justify-self: end;
      }

      .animatic-scrubber,
      .animatic-transport-note {
        grid-column: 1 / -1;
      }

      .animatic-dialogue {
        right: 8%;
        left: 8%;
        font-size: 13px;
      }
    }

  </style>
</head>

  <div class="app" id="app">

        <button class="context-bar team-context-trigger" id="teamContextTrigger" type="button" aria-label="当前团队菜单" aria-haspopup="menu" aria-controls="teamSwitchMenu" aria-expanded="false">

            <svg class="icon"><use href="#icon-building"></use></svg>
          </span>
          <span class="context-copy">
            <strong id="contextTitle">选择团队</strong>
            <span id="contextDetail">进入工作区前先选择一个团队</span>
          </span>
          <svg class="icon context-chevron" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
        </button>
        <button class="context-bar project-context-trigger top-project-switcher" id="topProjectSwitcher" type="button" aria-label="切换当前项目" aria-haspopup="menu" aria-controls="topProjectMenu" aria-expanded="false">

            <svg class="icon"><use href="#icon-briefcase"></use></svg>
          </span>
          <span class="context-copy">
            <strong id="topProjectTitle">选择项目</strong>
            <span id="topProjectDetail">当前项目</span>
          </span>
          <svg class="icon context-chevron" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>

      </div>

      <div class="top-actions">

      <button type="button" data-team-menu-action="settings">团队设置</button>
    </div>

    <div class="scope-switch-menu project-switch-menu" id="topProjectMenu" role="menu" aria-label="项目菜单"></div>

    <aside class="agent-drawer" id="agentDrawer" aria-label="个人 Agent">
      <div class="agent-head">
        <div class="agent-title-row">
          <strong>个人 Agent</strong>
          <button class="icon-button" id="agentClose" title="关闭" aria-label="关闭个人 Agent">
            <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
        </div>
        <div class="agent-identity">
          <span>授权主体</span><strong>繁星</strong>
          <span>当前作用域</span><strong id="agentScope">个人 · 全部授权团队</strong>
          <span>权限</span><strong>与繁星本人当前权限相同</strong>
        </div>
      </div>

      <div class="agent-thread" id="agentThread">
        <div class="message">
          我已继承当前页面作用域。读取和写入都会按繁星本人此刻的权限执行；确认不会增加权限。
        </div>
        <div class="message user">
          帮我看看这周最需要先处理什么。
        </div>
        <div class="message">
          优先处理 3 件事：确认车站段落的 6 条拆解候选、解决周四演员时间冲突、完成 30s 主片 v12 的内部审阅。
        </div>
      </div>

      <div class="agent-compose">
        <div class="quick-prompts">

      if (!team) {

      state.projectId = team.projects.some((item) => item.id === state.projectId)
        ? state.projectId
        : team.projects[0]?.id || null;
    }

    function restoreStateFromHash() {
      const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
      const allowedViews = new Set([
        "dashboard", "calendar", "notes", "personal-contacts", "team", "resources", "contacts", "assets", "portfolio",
        "project", "scripts", "breakdown", "schedule", "reviews"
      ]);

      state.agentOpen = false;
      app.classList.remove("agent-open");

      if (parts[0] === "team-select" || parts.length === 0) {
        state.teamId = null;
        state.projectId = null;
        state.teamSessionActive = false;
        state.view = "dashboard";
        normalizeContext();
        return;
      }

      if (!state.teamSessionActive || (state.teamId && parts[1] !== state.teamId)) {
        state.teamId = null;
        state.projectId = null;
        state.teamSessionActive = false;
        state.view = "dashboard";
        location.hash = "#/team-select";
        return;
      }

      if (parts[0] === "team") {
        const team = teams.find((item) => item.id === parts[1]);
        if (team) {
          state.teamId = team.id;
          state.projectId = team.projects[0]?.id || null;
        }
        let view = parts[2] || "dashboard";
        if (view === "contacts" || view === "assets") {
          state.resourceTab = view;
          view = "resources";
        }
        state.view = allowedViews.has(view) ? view : "dashboard";
      } else if (parts[0] === "project") {
        const team = teams.find((item) => item.id === parts[1]);
        const project = team?.projects.find((item) => item.id === parts[2]);
        if (team && project) {
          state.teamId = team.id;
          state.projectId = project.id;
          const view = parts[3] || "project";
          state.view = allowedViews.has(view) && isProjectView(view) ? view : "project";
        } else {
          state.teamId = null;
          state.projectId = null;
          state.view = "dashboard";
        }
      } else {
        state.teamId = null;
        state.projectId = null;
        state.view = "dashboard";
      }

      normalizeContext();
    }

    function hashForState() {
      if (!state.teamId) return "team-select";
      if (isTeamView(state.view) || isPersonalView(state.view)) {
        return `team/${state.teamId}/${state.view}`;
      }
      return `project/${state.teamId}/${state.projectId}/${state.view}`;
    }

      if (isTeamView()) return `团队 · ${currentTeam().name}`;
      return "尚未指定；写入前必须选择唯一项目";

    function syncTopProjectSwitcher(team) {
      const visible = Boolean(team && isProjectView());
      const project = visible ? currentProject() : null;
      topProjectSwitcher.classList.toggle("is-visible", visible);
      topProjectSwitcher.setAttribute("aria-hidden", String(!visible));
      topProjectSwitcher.disabled = !visible;
      if (!visible) {
        topProjectTitle.textContent = "选择项目";
        topProjectDetail.textContent = "当前项目";
        topProjectMenu.innerHTML = "";

      }
      topProjectTitle.textContent = project.name;
      topProjectDetail.textContent = `当前项目 · ${project.status}`;
      renderTopProjectMenu(team);
    }

    function projectMatchesMenuFilter(project) {
      const archived = project.status.includes("归档");
      if (state.projectMenuFilter === "active") return !archived;
      if (state.projectMenuFilter === "archived") return archived;
      return true;
    }

    function sortedProjectMenuItems(team) {
      const query = state.projectMenuQuery.trim().toLocaleLowerCase("zh-CN");
      const recentOrder = [state.projectId, ...state.recentProjectIds];
      const recentRank = new Map(recentOrder.map((id, index) => [id, index]));
      return team.projects
        .filter(projectMatchesMenuFilter)
        .filter((project) => {
          if (!query) return true;
          return [project.name, project.status, project.role]
            .some((value) => String(value).toLocaleLowerCase("zh-CN").includes(query));
        })
        .sort((a, b) => {
          const aRank = recentRank.has(a.id) ? recentRank.get(a.id) : Number.MAX_SAFE_INTEGER;
          const bRank = recentRank.has(b.id) ? recentRank.get(b.id) : Number.MAX_SAFE_INTEGER;
          return aRank - bRank || a.name.localeCompare(b.name, "zh-CN");
        });
    }

    function refreshProjectMenuResults(team = currentTeam()) {
      if (!team) return;
      const list = topProjectMenu.querySelector("[data-project-menu-list]");
      const count = topProjectMenu.querySelector("[data-project-menu-count]");

    function positionScopeMenu(menu, trigger) {
      const rect = trigger.getBoundingClientRect();
      if (window.innerWidth <= 720) {
        menu.style.left = "12px";
        menu.style.right = "12px";
        menu.style.width = "auto";
        menu.style.top = `${rect.bottom + 6}px`;
        return;
      }
      const width = menu === topProjectMenu ? Math.max(360, rect.width) : Math.max(240, rect.width);
      const left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
      menu.style.left = `${left}px`;
      menu.style.right = "auto";
      menu.style.width = `${width}px`;
      menu.style.top = `${rect.bottom + 6}px`;
    }

    function closeScopeMenu(menu, trigger) {
      menu.classList.remove("open");
      trigger.setAttribute("aria-expanded", "false");
    }

    function toggleScopeMenu(menu, trigger, otherMenu, otherTrigger) {
      const open = !menu.classList.contains("open");
      closeScopeMenu(otherMenu, otherTrigger);
      if (open) positionScopeMenu(menu, trigger);
      menu.classList.toggle("open", open);
      trigger.setAttribute("aria-expanded", String(open));
    }

    function rememberProjectVisit(projectId) {
      const previousProjectId = state.projectId;
      state.projectId = projectId;
      state.recentProjectIds = [projectId, previousProjectId, ...state.recentProjectIds]

        .slice(0, 5);
